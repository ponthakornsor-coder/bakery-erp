/* === v9.95: Kiosk mode สำหรับ Tablet ประจำ Station ===
 * เปิดผ่านลิงก์ ?kiosk=1&station=...&token=...&key=... (สร้างจากปุ่ม "คัดลอกลิงก์ Kiosk" ในหน้า
 * "จัดการ Station / Tablet") ทำงานแยกจากแอปหลักทั้งหมด ไม่ผ่านหน้า Login เลย เพราะ Token ผูกกับตัว
 * Station ไม่ใช่ผูกกับ user คนใดคนหนึ่ง — เหมาะกับ Tablet ที่เสียบทิ้งไว้ประจำจุด ไม่มีคนล็อกอินเข้าออก
 */
const KIOSK_MODE = ERP_QUERY.get('kiosk') === '1';
function startKiosk(){
  const stationId = ERP_QUERY.get('station') || '';
  const stationToken = ERP_QUERY.get('token') || '';
  const stationName = ERP_QUERY.get('name') || '';
  const urlKey = ERP_QUERY.get('key') || '';
  if(urlKey){ apiKey = urlKey; localStorage.setItem('bakery_api_key', urlKey); }
  document.body.classList.add('login-locked'); // ซ่อนแอปหลัก/หน้า login ปกติทั้งหมด ไม่ให้ปนกับ Kiosk
  const root=document.createElement('div');
  root.id='kioskRoot';
  root.style.cssText='position:fixed;inset:0;background:#1c1f2e;color:#fff;z-index:100;display:flex;flex-direction:column;font-family:Inter,Segoe UI,Tahoma,sans-serif;overflow:auto';
  document.body.appendChild(root);
  if(!stationId || !stationToken){
    root.innerHTML='<div style="margin:auto;text-align:center;padding:24px"><div style="font-size:60px">⚠️</div><h1>ลิงก์ Kiosk ไม่ถูกต้อง</h1><p>ขาด station หรือ token ในลิงก์ — ไปคัดลอกลิงก์ใหม่จากหน้า "จัดการ Station / Tablet" อีกครั้ง</p></div>';
    return;
  }
  let audioCtx=null, unlocked=false, knownIds=new Set(), firstLoad=true, wakeLock=null, pollTimer=null;
  function beep(){
    try{
      if(!audioCtx) return;
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3,audioCtx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+0.55);
      setTimeout(()=>{ if(!audioCtx) return; const o2=audioCtx.createOscillator(),g2=audioCtx.createGain(); o2.type='sine'; o2.frequency.value=1100; g2.gain.setValueAtTime(0.0001,audioCtx.currentTime); g2.gain.exponentialRampToValueAtTime(0.3,audioCtx.currentTime+0.02); g2.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.5); o2.connect(g2); g2.connect(audioCtx.destination); o2.start(); o2.stop(audioCtx.currentTime+0.55); },250);
    }catch(e){ console.error('beep failed',e); }
  }
  async function requestWakeLock(){
    try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }
    catch(e){ console.error('wake lock failed (ไม่ร้ายแรง จอแค่อาจดับได้ถ้าไม่ตั้ง Screen timeout ที่ตัว Tablet เอง)', e); }
  }
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && unlocked) requestWakeLock(); });
  function kioskModal(html){
    let ov=document.getElementById('kioskModalOverlay');
    if(!ov){
      ov=document.createElement('div');
      ov.id='kioskModalOverlay';
      ov.style.cssText='position:fixed;inset:0;background:#000000cc;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
      root.appendChild(ov);
    }
    ov.innerHTML=html;
    ov.style.display='flex';
  }
  function kioskCloseModal(){
    const ov=document.getElementById('kioskModalOverlay');
    if(ov) ov.style.display='none';
  }
  function kioskErrorModal(title,e){
    kioskModal('<div style="background:#262a3c;border-radius:20px;padding:32px;max-width:420px;text-align:center"><div style="font-size:44px">⚠️</div><div style="font-size:20px;font-weight:700;margin:12px 0">'+escHTML(title)+'</div><div style="opacity:.8;margin-bottom:20px">'+escHTML(e&&e.message||String(e))+'</div><button id="kioskErrClose" style="border:0;background:#df6518;color:#fff;font-size:18px;font-weight:700;border-radius:12px;padding:14px 28px;cursor:pointer">ปิด</button></div>');
    const b=document.getElementById('kioskErrClose'); if(b) b.onclick=kioskCloseModal;
  }
  let actionBusy=false, lastJobs=[];
  function startJob(po){
    if(actionBusy) return; actionBusy=true;
    // v9.101: เดิมรอผล API ก่อนค่อยอัปเดตจอ (Apps Script บางทีตอบช้า 10-40 วิ) พนักงานกดแล้วจอไม่ขยับ
    // เลยคิดว่ากดไม่ติด ตอนนี้เปลี่ยนสถานะบนจอทันทีแบบ optimistic (เหมือน cancelPO ที่มีอยู่แล้ว)
    // แล้วค่อยยิง API เบื้องหลัง ถ้าพลาดค่อยย้อนสถานะกลับ
    const job=lastJobs.find(j=>String(j.po)===String(po));
    const prevStatus=job?job.status:null;
    if(job){ job.status='In Progress'; renderQueue(lastJobs); }
    apiGetOnce('stationstartjob',{station:stationId,token:stationToken,po}).then(()=>{actionBusy=false; poll();}).catch(e=>{
      actionBusy=false;
      if(job){ job.status=prevStatus; renderQueue(lastJobs); }
      kioskErrorModal('เริ่มงานไม่สำเร็จ (สถานะย้อนกลับแล้ว)',e);
    });
  }
  function openCompleteModal(po,sku,qty){
    kioskModal('<div style="background:#262a3c;border-radius:20px;padding:32px;max-width:460px;width:100%;text-align:center">'+
      '<div style="font-size:22px;font-weight:800;margin-bottom:8px">ยืนยันจำนวนที่ผลิตได้จริง</div>'+
      '<div style="opacity:.75;margin-bottom:16px">'+escHTML(sku)+' · สั่งผลิต '+roundDisplay(qty)+' ชิ้น</div>'+
      '<input id="kioskActualQty" type="number" min="0" value="'+(+qty||0)+'" style="font-size:28px;text-align:center;width:100%;padding:14px;border-radius:12px;border:none;margin-bottom:20px">'+
      '<div style="display:flex;gap:12px;justify-content:center">'+
      '<button id="kioskCompleteConfirm" style="flex:1;border:0;background:#059669;color:#fff;font-size:18px;font-weight:800;border-radius:12px;padding:16px;cursor:pointer">✅ ยืนยัน จบงาน</button>'+
      '<button id="kioskCompleteCancel" style="flex:1;border:0;background:#3a3f57;color:#fff;font-size:18px;font-weight:700;border-radius:12px;padding:16px;cursor:pointer">ยกเลิก</button>'+
      '</div></div>');
    document.getElementById('kioskCompleteCancel').onclick=kioskCloseModal;
    document.getElementById('kioskCompleteConfirm').onclick=()=>submitComplete(po);
  }
  function submitComplete(po){
    if(actionBusy) return;
    const input=document.getElementById('kioskActualQty');
    const actualqty=+((input&&input.value)||0);
    if(isNaN(actualqty)||actualqty<0) return;
    actionBusy=true;
    kioskCloseModal();
    // v9.101: ลบงานออกจากจอทันที (optimistic) แทนที่จะค้างกล่อง "กำลังบันทึก..." รอผล API ซึ่งอาจช้า
    // หลายสิบวินาที ทำให้รู้สึกเหมือนกดไม่ติด — ถ้า API พลาดจะเอางานกลับเข้าคิวให้เหมือนเดิม
    const idx=lastJobs.findIndex(j=>String(j.po)===String(po));
    const removed=idx>=0?lastJobs.splice(idx,1)[0]:null;
    renderQueue(lastJobs);
    apiGetOnce('stationcompletejob',{station:stationId,token:stationToken,po,actualqty}).then(()=>{actionBusy=false; poll();}).catch(e=>{
      actionBusy=false;
      if(removed){ lastJobs.splice(idx,0,removed); renderQueue(lastJobs); }
      kioskErrorModal('บันทึกไม่สำเร็จ (งานกลับเข้าคิวแล้ว)',e);
    });
  }
  function renderQueue(jobs){
    const openJobs=(jobs||[]).filter(j=>j.status!=='Completed'&&j.status!=='Cancelled');
    const newOnes=openJobs.filter(j=>!knownIds.has(j.po));
    if(!firstLoad && newOnes.length) beep();
    firstLoad=false;
    knownIds=new Set(openJobs.map(j=>j.po));
    const body=$('kioskBody');
    if(!body) return;
    if(!openJobs.length){
      body.innerHTML='<div style="margin:auto;text-align:center;opacity:.7"><div style="font-size:80px">✅</div><div style="font-size:28px;font-weight:800">ไม่มีงานรอผลิตตอนนี้</div></div>';
      return;
    }
    body.innerHTML=openJobs.map(j=>`<div style="background:#262a3c;border-radius:24px;padding:28px 32px;margin:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-left:10px solid ${j.status==='In Progress'?'#df6518':'#059669'}">
      ${j.imageUrl?`<img src="${j.imageUrl}" style="width:110px;height:110px;object-fit:cover;border-radius:16px;flex:0 0 auto">`:'<div style="width:110px;height:110px;border-radius:16px;background:#3a3f57;display:flex;align-items:center;justify-content:center;font-size:44px;flex:0 0 auto">📦</div>'}
      <div style="flex:1;min-width:200px">
        <div style="font-size:34px;font-weight:800">${escHTML(j.productName||j.sku)}</div>
        <div style="font-size:20px;opacity:.75;margin-top:4px">${escHTML(j.sku)} ${j.remark?' · '+escHTML(j.remark):''}</div>
        <div style="font-size:16px;opacity:.55;margin-top:8px">${j.status==='In Progress'?'🟠 กำลังทำ':'⚪ รอเริ่มทำ'}</div>
      </div>
      <div style="font-size:56px;font-weight:900;color:#df6518;flex:0 0 auto">${roundDisplay(j.qty)}</div>
      <div style="flex:0 0 auto"><button class="kioskActBtn" data-po="${escHTML(j.po)}" data-sku="${escHTML(j.sku)}" data-qty="${+j.qty||0}" data-inprogress="${j.status==='In Progress'?'1':'0'}" style="border:0;background:${j.status==='In Progress'?'#059669':'#df6518'};color:#fff;font-size:18px;font-weight:800;border-radius:14px;padding:16px 22px;cursor:pointer;white-space:nowrap">${j.status==='In Progress'?'✅ จบงาน':'▶ เริ่มทำ'}</button></div>
    </div>`).join('');
    body.querySelectorAll('.kioskActBtn').forEach(function(btn){
      btn.onclick=function(){
        const po=btn.dataset.po, sku=btn.dataset.sku, qty=+btn.dataset.qty||0;
        if(btn.dataset.inprogress==='1') openCompleteModal(po,sku,qty);
        else startJob(po);
      };
    });
  }
  async function poll(){
    try{
      const res=await apiGetOnce('stationqueue',{station:stationId,token:stationToken});
      // v9.101 fix: ถ้ามีการกด เริ่มทำ/จบงาน ค้างอยู่ (actionBusy) ห้ามเอาผลโพลรอบนี้ (ซึ่งเป็นข้อมูลเก่า
      // ก่อนกดจะเสร็จ) มาทับสถานะที่เพิ่ง optimistic update ไป ไม่งั้นจอจะเด้งกลับเป็นค่าเก่าทั้งที่ request
      // ที่กดไปยังไม่ตอบกลับ (Apps Script ตอบช้าได้ถึง 30-40 วิ) ทำให้เหมือนกดไม่ติดตอนกดซ้ำ (actionBusy กันไว้)
      if(!actionBusy){
        lastJobs=res.jobs||[];
        renderQueue(lastJobs);
      }
      const status=$('kioskStatus'); if(status){ status.textContent='อัปเดตล่าสุด '+new Date().toLocaleTimeString('th-TH'); status.style.color='#8b755d'; }
    }catch(e){
      console.error(e);
      const status=$('kioskStatus'); if(status){ status.textContent='เชื่อมต่อไม่ได้ (จะลองใหม่อัตโนมัติ): '+(e.message||e); status.style.color='#dc2626'; }
    }
  }
  function startPolling(){
    poll();
    if(pollTimer) clearInterval(pollTimer);
    pollTimer=setInterval(poll, 15000);
  }
  function unlockAndStart(){
    if(unlocked) return; unlocked=true;
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ console.error('AudioContext ไม่รองรับ',e); }
    requestWakeLock();
    root.innerHTML=`<div style="padding:20px 28px;background:#15182280;display:flex;align-items:center;gap:16px;border-bottom:1px solid #2c2f42"><div style="font-size:22px;font-weight:800">📟 คิวงานผลิต — ${stationName?escHTML(stationName):'Station'}</div><div id="kioskStatus" style="margin-left:auto;font-size:14px;color:#8b755d">กำลังโหลด...</div></div><div id="kioskBody" style="flex:1;display:flex;flex-direction:column;padding:8px 0"></div>`;
    startPolling();
  }
  root.innerHTML=`<div style="margin:auto;text-align:center;padding:24px"><div style="font-size:70px">📟</div><h1 style="font-size:30px">พร้อมใช้งาน Kiosk${stationName?'<br><span style=\"font-size:20px;opacity:.75\">'+escHTML(stationName)+'</span>':''}</h1><p style="opacity:.75;max-width:420px;margin:8px auto 24px">กดปุ่มด้านล่างครั้งเดียวเพื่อเปิดเสียงแจ้งเตือนงานใหม่ จากนั้นจะทำงานเองตลอด ไม่ต้องแตะจออีก</p><button onclick="(function(){window.__kioskStart&&window.__kioskStart()})()" style="border:0;background:#df6518;color:#fff;font-size:22px;font-weight:800;border-radius:16px;padding:20px 40px;cursor:pointer">▶ เริ่มใช้งาน Kiosk</button></div>`;
  window.__kioskStart = unlockAndStart;
}
/* === v9.97: B2B Customer Order Portal ===
 * เปิดผ่านลิงก์ ?b2b=1&customer=...&token=...&key=... (จากปุ่ม "คัดลอกลิงก์สั่งของ B2B" ในหน้า "ลูกค้า (CRM)")
 * ลูกค้าไม่ต้อง login เลย เพราะ Token ผูกกับตัวลูกค้าคนนั้นโดยตรง ไม่ใช่ user บัญชีพนักงาน — แยกจากแอปหลัก
 * เหมือน Kiosk mode ทุกจุด
 */
const B2B_MODE = ERP_QUERY.get('b2b') === '1';
function startB2BPortal(){
  const customerId = ERP_QUERY.get('customer') || '';
  const custToken = ERP_QUERY.get('token') || '';
  const urlKey = ERP_QUERY.get('key') || '';
  if(urlKey){ apiKey = urlKey; localStorage.setItem('bakery_api_key', urlKey); }
  document.body.classList.add('login-locked');
  const root=document.createElement('div');
  root.id='b2bRoot';
  root.style.cssText='position:fixed;inset:0;background:#f7f3ee;color:#2b2620;z-index:100;overflow:auto;font-family:Inter,Segoe UI,Tahoma,sans-serif;padding:20px';
  document.body.appendChild(root);
  if(!customerId || !custToken){
    root.innerHTML='<div style="max-width:480px;margin:60px auto;text-align:center"><div style="font-size:60px">⚠️</div><h1>ลิงก์ไม่ถูกต้อง</h1><p>ขาดข้อมูลลูกค้าหรือ Token ในลิงก์ — กรุณาขอลิงก์ใหม่จากร้าน</p></div>';
    return;
  }
  let portalData=null, lines=[{sku:'',qty:'',remark:''}];
  function fmtStatus(s){
    const map={Pending:['รอตรวจสอบ','#7a5b00','#fff3cd'],Approved:['อนุมัติแล้ว','#065f46','#d1fae5'],Rejected:['ปฏิเสธ','#991b1b','#fee2e2']};
    const v=map[s]||[s,'#444','#eee'];
    return `<span style="background:${v[2]};color:${v[1]};padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700">${v[0]}</span>`;
  }
  function syncLines(){
    lines=lines.map((_,i)=>({
      sku: root.querySelector('.b2bLineSku[data-i="'+i+'"]')?.value||'',
      qty: root.querySelector('.b2bLineQty[data-i="'+i+'"]')?.value||'',
      remark: root.querySelector('.b2bLineRemark[data-i="'+i+'"]')?.value||''
    }));
  }
  function renderForm(){
    const products=(portalData?.products||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
    return `<div style="background:#fff;border-radius:16px;padding:20px;margin-bottom:16px">
      <h2 style="margin:0 0 12px">สั่งสินค้าใหม่</h2>
      <label style="font-size:13px;opacity:.7">วันที่ต้องการรับของ</label><br>
      <input id="b2bNeededDate" type="date" value="${todayISO()}" style="margin-bottom:12px;padding:8px;border-radius:8px;border:1px solid #ddd">
      <div id="b2bLines">${lines.map((l,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <select data-i="${i}" class="b2bLineSku" style="flex:2;min-width:160px;padding:8px;border-radius:8px;border:1px solid #ddd"><option value="">-- เลือกสินค้า --</option>${products.map(p=>`<option value="${p.sku}" ${l.sku===p.sku?'selected':''}>${escHTML(p.name)}</option>`).join('')}</select>
        <input data-i="${i}" class="b2bLineQty" type="number" min="1" placeholder="จำนวน" value="${l.qty}" style="width:100px;padding:8px;border-radius:8px;border:1px solid #ddd">
        <input data-i="${i}" class="b2bLineRemark" placeholder="หมายเหตุ" value="${escHTML(l.remark||'')}" style="flex:1;min-width:120px;padding:8px;border-radius:8px;border:1px solid #ddd">
        <button onclick="window.__b2bDelLine(${i})" style="border:0;background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px 12px;cursor:pointer">ลบ</button>
      </div>`).join('')}</div>
      <button onclick="window.__b2bAddLine()" style="border:1px dashed #999;background:none;border-radius:8px;padding:8px 14px;cursor:pointer;margin-bottom:14px">+ เพิ่มรายการ</button><br>
      <textarea id="b2bRemark" placeholder="หมายเหตุรวม (ไม่บังคับ)" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ddd;min-height:60px"></textarea>
      <div style="margin-top:14px"><button onclick="window.__b2bSubmit()" style="border:0;background:#df6518;color:#fff;font-weight:800;font-size:16px;border-radius:10px;padding:12px 24px;cursor:pointer">ส่งออเดอร์</button></div>
    </div>`;
  }
  function renderHistory(){
    const orders=(portalData?.orders||[]).slice().sort((a,b)=>trxSortKey(b.neededDate)-trxSortKey(a.neededDate));
    if(!orders.length) return '<div style="background:#fff;border-radius:16px;padding:20px"><p style="opacity:.6">ยังไม่เคยส่งออเดอร์เข้ามา</p></div>';
    return `<div style="background:#fff;border-radius:16px;padding:20px">
      <h2 style="margin:0 0 12px">ประวัติออเดอร์</h2>
      ${orders.map(o=>`<div style="border-bottom:1px solid #eee;padding:10px 0">
        <div style="display:flex;justify-content:space-between;align-items:center"><b>ต้องการวันที่ ${escHTML(o.neededDate)}</b>${fmtStatus(o.status)}</div>
        <div style="font-size:14px;opacity:.75;margin-top:4px">${(o.items||[]).map(i=>escHTML(i.sku)+' x'+i.qty).join(', ')}</div>
        ${o.status==='Rejected'&&o.rejectReason?`<div style="font-size:13px;color:#991b1b;margin-top:4px">เหตุผล: ${escHTML(o.rejectReason)}</div>`:''}
      </div>`).join('')}
    </div>`;
  }
  function renderAll(){
    root.innerHTML=`<div style="max-width:640px;margin:0 auto">
      <div style="text-align:center;margin-bottom:16px"><h1 style="margin:0">🧁 ฟอร์มสั่งของ B2B</h1><p style="opacity:.7">${escHTML(portalData?.customerName||'')} — แต้มสะสม <b>${roundDisplay(portalData?.points||0)}</b></p></div>
      ${renderForm()}
      ${renderHistory()}
    </div>`;
  }
  window.__b2bAddLine=()=>{ syncLines(); lines.push({sku:'',qty:'',remark:''}); renderAll(); };
  window.__b2bDelLine=(i)=>{ syncLines(); lines.splice(i,1); if(!lines.length) lines=[{sku:'',qty:'',remark:''}]; renderAll(); };
  window.__b2bSubmit=async()=>{
    syncLines();
    const neededDate=$('b2bNeededDate')?.value||todayISO();
    const remark=($('b2bRemark')?.value||'').trim();
    const items=lines.map(l=>({sku:l.sku,qty:+l.qty||0,remark:l.remark||''})).filter(l=>l.sku&&l.qty>0);
    if(!items.length){ alert('เลือกสินค้าและใส่จำนวนอย่างน้อย 1 รายการ'); return; }
    try{
      const requestId=Date.now()+'-'+Math.random().toString(36).slice(2);
      await apiGetOnce('submitb2border',{customer:customerId,token:custToken,payload:JSON.stringify({neededDate,remark,items,requestId})});
      lines=[{sku:'',qty:'',remark:''}];
      await load();
      alert('ส่งออเดอร์เรียบร้อย ทางร้านจะตรวจสอบและติดต่อกลับ');
    }catch(e){ console.error(e); alert('ส่งออเดอร์ไม่สำเร็จ: '+(e.message||e)); }
  };
  async function load(){
    try{
      const res=await apiGetOnce('b2bportaldata',{customer:customerId,token:custToken});
      portalData=res;
      renderAll();
    }catch(e){
      console.error(e);
      root.innerHTML='<div style="max-width:480px;margin:60px auto;text-align:center"><div style="font-size:60px">⚠️</div><h1>โหลดข้อมูลไม่สำเร็จ</h1><p>'+escHTML(e.message||String(e))+'</p></div>';
    }
  }
  load();
}
/* === v9.98: สมัครสมาชิกลูกค้าใหม่ด้วยตัวเอง (ไม่ต้อง login) ===
 * ลิงก์เดียวใช้ร่วมกันได้ทุกคน (แปะบูธ/แนบพัสดุ TikTok-Shopee) ต่างจาก B2B portal ที่ผูก token ต่อคน
 * เพราะตอนนี้ยังไม่มีตัวตนลูกค้าเลย — สมัครเสร็จฝั่ง Server กันสมัครซ้ำด้วยเบอร์โทร (ไม่ใช่ token)
 */
const JOIN_MODE = ERP_QUERY.get('join') === '1';
function startJoinPortal(){
  const urlKey = ERP_QUERY.get('key') || '';
  if(urlKey){ apiKey = urlKey; localStorage.setItem('bakery_api_key', urlKey); }
  document.body.classList.add('login-locked');
  const root=document.createElement('div');
  root.id='joinRoot';
  root.style.cssText='position:fixed;inset:0;background:#f7f3ee;color:#2b2620;z-index:100;overflow:auto;font-family:Inter,Segoe UI,Tahoma,sans-serif;padding:20px';
  document.body.appendChild(root);
  const OCCUPATIONS=['นักเรียน/นักศึกษา','พนักงานบริษัท','ข้าราชการ/รัฐวิสาหกิจ','เจ้าของธุรกิจ/ค้าขาย','ฟรีแลนซ์','แม่บ้าน/พ่อบ้าน','เกษียณอายุ','อื่นๆ'];
  function renderForm(){
    root.innerHTML=`<div style="max-width:480px;margin:40px auto">
      <div style="text-align:center;margin-bottom:16px"><h1 style="margin:0">🧁 สมัครสมาชิก</h1><p style="opacity:.7">กรอกข้อมูลด้านล่าง สมัครฟรี สะสมแต้มแลกของรางวัลได้ทันที</p></div>
      <div style="background:#fff;border-radius:16px;padding:24px">
        <label style="font-size:13px;opacity:.7">ชื่อ-นามสกุล</label><br>
        <input id="joinName" placeholder="ชื่อ-นามสกุล" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin:6px 0 14px;box-sizing:border-box">
        <label style="font-size:13px;opacity:.7">เบอร์โทร</label><br>
        <input id="joinPhone" type="tel" placeholder="0812345678" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin:6px 0 14px;box-sizing:border-box">
        <label style="font-size:13px;opacity:.7">วันเกิด</label><br>
        <input id="joinBirthday" type="date" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin:6px 0 14px;box-sizing:border-box">
        <label style="font-size:13px;opacity:.7">อาชีพ</label><br>
        <select id="joinOccupation" onchange="$('joinOccupationOther').style.display=this.value==='อื่นๆ'?'block':'none'" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin:6px 0 8px;box-sizing:border-box"><option value="">-- เลือกอาชีพ --</option>${OCCUPATIONS.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>
        <input id="joinOccupationOther" placeholder="ระบุอาชีพ" style="display:none;width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin:0 0 14px;box-sizing:border-box">
        <p style="font-size:12px;opacity:.55;margin:0 0 16px">ข้อมูลนี้ใช้เพื่อมอบสิทธิพิเศษ/ของรางวัลวันเกิด และปรับปรุงสินค้าให้ตรงใจลูกค้ามากขึ้นเท่านั้น</p>
        <button onclick="window.__joinSubmit()" style="width:100%;border:0;background:#df6518;color:#fff;font-weight:800;font-size:16px;border-radius:10px;padding:14px;cursor:pointer">สมัครสมาชิก</button>
      </div>
    </div>`;
  }
  function renderResult(msg,isError){
    root.innerHTML=`<div style="max-width:480px;margin:80px auto;text-align:center">
      <div style="font-size:70px">${isError?'⚠️':'🎉'}</div>
      <h1>${isError?'สมัครไม่สำเร็จ':'สมัครสมาชิกสำเร็จ'}</h1>
      <p style="opacity:.75">${escHTML(msg)}</p>
      ${isError?'<button onclick="window.__joinRetry()" style="margin-top:12px;border:0;background:#df6518;color:#fff;font-weight:700;border-radius:10px;padding:10px 22px;cursor:pointer">ลองใหม่</button>':''}
    </div>`;
  }
  window.__joinRetry=renderForm;
  window.__joinSubmit=async()=>{
    const name=($('joinName')?.value||'').trim();
    const phone=($('joinPhone')?.value||'').trim();
    const birthday=$('joinBirthday')?.value||'';
    const occSel=$('joinOccupation')?.value||'';
    const occupation=occSel==='อื่นๆ'?($('joinOccupationOther')?.value||'').trim():occSel;
    if(!name||!phone||!birthday||!occupation){ alert('กรุณากรอกข้อมูลให้ครบทุกช่อง'); return; }
    try{
      const res=await apiGetOnce('selfregistercustomer',{payload:JSON.stringify({name,phone,birthday,occupation})});
      if(res.alreadyMember){
        renderResult('เบอร์ '+phone+' เป็นสมาชิกอยู่แล้ว มีแต้มสะสม '+roundDisplay(res.points||0)+' แต้ม แจ้งเบอร์นี้กับพนักงานทุกครั้งที่ซื้อของเพื่อสะสมแต้มเพิ่มได้เลยครับ',false);
      }else{
        renderResult('ยินดีต้อนรับคุณ '+name+'! แจ้งเบอร์ '+phone+' กับพนักงานทุกครั้งที่ซื้อของ เพื่อสะสมแต้มและแลกของรางวัลได้เลยครับ',false);
      }
    }catch(e){ console.error(e); renderResult(e.message||String(e),true); }
  };
  renderForm();
}
if(KIOSK_MODE){
  startKiosk();
}else if(B2B_MODE){
  startB2BPortal();
}else if(JOIN_MODE){
  startJoinPortal();
}else if(localStorage.getItem('bakery_logged_in')==='1' && sessionToken){
  startApp();
}else{
  showLoginScreen();
}
</script></body></html>
