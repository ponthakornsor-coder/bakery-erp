const SAFE_TO_RETRY_ACTIONS_=['all','sheet'];
async function apiGet(action='all', params={}, _retriesLeft){
  // v9.38 fix: การโหลดข้อมูล (action=all/sheet) เป็น read-only ไม่มีผลข้างเคียง ลองใหม่อัตโนมัติได้อย่าง
  // ปลอดภัยถ้าเชื่อมต่อไม่ติด (ไม่ต้องให้คนกด Refresh เองซ้ำๆ) ส่วน action ที่เป็นการเขียนข้อมูล
  // (fastwrite/write) ไม่ลองซ้ำอัตโนมัติ เพราะถ้ารอบแรกสำเร็จฝั่ง Server แล้วแค่ client ไม่ทันรู้ผล
  // การยิงซ้ำอาจกลายเป็นสร้างข้อมูลซ้ำ (บั๊กคลาสเดียวกับที่เจอเรื่อง movement ซ้ำมาก่อน)
  if(_retriesLeft===undefined) _retriesLeft=SAFE_TO_RETRY_ACTIONS_.includes(action)?2:0;
  try{
    return await apiGetOnce(action, params);
  }catch(e){
    if(_retriesLeft>0){
      await new Promise(r=>setTimeout(r,1200));
      return apiGet(action, params, _retriesLeft-1);
    }
    throw e;
  }
}
let sessionExpiredHandled_=false;
function handleSessionExpired_(msg){
  // v9.98: เดิม Session หมดอายุแล้วต้องกดปุ่ม "ออกจากระบบ" เองก่อนถึงจะเข้าหน้า login ได้ (ทั้งที่ error
  // ก็บอกชัดอยู่แล้วว่า session หมดอายุ) ตอนนี้ตรวจจับ error นี้จากทุก API call แล้วพาเข้าหน้า login ทันที
  // พร้อมใส่ username เดิมให้เลย เหลือแค่พิมพ์รหัสผ่านซ้ำ ไม่ต้องไปหาปุ่ม Logout เอง
  if(sessionExpiredHandled_) return;
  sessionExpiredHandled_=true;
  const lastUsername=userUsername;
  sessionToken=''; userRole=''; userDisplayName=''; userUsername='';
  localStorage.removeItem('bakery_session_token');
  localStorage.removeItem('bakery_user_role');
  localStorage.removeItem('bakery_user_display_name');
  localStorage.removeItem('bakery_user_username');
  localStorage.removeItem('bakery_logged_in');

  setTimeout(()=>{ const uEl=$('loginUser'); if(uEl && lastUsername){ uEl.value=lastUsername; const pwEl=$('loginPw'); if(pwEl) pwEl.focus(); } },60);
}
function apiGetOnce(action='all', params={}){
  if(!apiUrl) return Promise.reject(new Error('ยังไม่ได้ใส่ API URL'));
  const cb='jsonp_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  const url=new URL(apiUrl);
  url.searchParams.set('action',action); url.searchParams.set('callback',cb);
  if(apiKey) url.searchParams.set('key',apiKey);
  if(sessionToken) url.searchParams.set('session',sessionToken);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    // v9.25: ข้อมูลโตขึ้นเรื่อยๆ Apps Script อาจใช้เวลานานกว่าเดิม เพิ่ม timeout จาก 60s เป็น 150s
    // และงานส่วนใหญ่ (Sync, Cycle Count, ฯลฯ) ยังทำสำเร็จฝั่ง Server แม้ browser จะ timeout ก่อนก็ตาม
    const timer=setTimeout(()=>{cleanup();reject(new Error('รอผลนานเกินไป (150 วินาที) แต่งานอาจจะสำเร็จฝั่ง Server แล้ว ลองกด Refresh/Sync อีกครั้งเพื่อเช็คผลจริง'))},150000);
    function cleanup(){clearTimeout(timer); delete window[cb]; s.remove();}
    window[cb]=data=>{
      cleanup();
      if(data&&data.ok) return resolve(data);
      const errMsg=data?.error||'API error';
      if(String(errMsg).includes('หมดอายุหรือไม่ถูกต้อง')) handleSessionExpired_(errMsg);
      reject(new Error(errMsg));
    };
    s.onerror=()=>{cleanup();reject(new Error('เชื่อมต่อ API ไม่ได้ งานอาจจะสำเร็จฝั่ง Server แล้วก็ได้ ลองกด Refresh/Sync อีกครั้งเพื่อเช็คผลจริง'))};
    s.src=url.toString(); document.body.appendChild(s);
  });
}

async function apiPost(body,_retriesLeft){
  if(!apiUrl) throw new Error('ยังไม่ได้ใส่ API URL');
  // v9.45 fix: เดิม "การเขียน" ไม่เคย retry อัตโนมัติเลย เพราะกลัวเขียนซ้ำถ้า Server ทำสำเร็จไปแล้วแต่
  // client แค่รอผลไม่ทัน ผู้ใช้เลยต้องกดปุ่มเองซ้ำ ซึ่งเสี่ยงเขียนซ้ำพอกัน (หรือมากกว่า เพราะกดหลายครั้ง)
  // ตอนนี้แนบ requestId เดียวกันไว้ทุกครั้งที่พยายามคำขอเดิม ฝั่ง Server จะจำผลไว้แล้วกันไม่ให้รันซ้ำ
  // (ดู withIdempotency_ ใน .gs) ทำให้ auto-retry ได้อย่างปลอดภัยจริง ไม่ต้องมานั่งกดเองอีกต่อไป
  if(!body.requestId) body.requestId=Date.now()+'-'+Math.random().toString(36).slice(2);
  if(_retriesLeft===undefined) _retriesLeft=2;
  showSyncOverlay(syncActionLabel(body.action));
  // v9.11: ใช้ fastwrite ก่อน เพื่อลดเวลา setup/recalc ทั้งระบบของ Apps Script
  // ถ้า Apps Script ยังไม่ได้อัปเดต จะ fallback ไป write ตัวเดิมอัตโนมัติ
  try{
    let result;
    try{
      result=await apiGetOnce('fastwrite',{payload:JSON.stringify(body)});
    }catch(e){
      const msg=String(e && e.message || e);
      if(msg.includes('Unknown action') || msg.includes('API error') || msg.includes('fastwrite')){
        result=await apiGetOnce('write',{payload:JSON.stringify(body)});
      }else{
        throw e;
      }
    }
    // v9.99: เดิมบันทึกเสร็จแล้วต้องยิง action=all แยกอีกรอบเพื่อโหลดข้อมูลใหม่ (รอบละ 2-10 วิ x 2 รอบ)
    // ตอนนี้ฝาก getAllData() ล่าสุดมากับผลบันทึกเลยในคำขอเดียว ไม่ต้องเรียกซ้ำ (ดู loadFromGoogleSheet)
    if(result && result.data){
      fromSheetData(result.data);
      saveLocalOnly();
      lastFullSyncAt=Date.now();
    }
    hideSyncOverlaySuccess('บันทึกเข้า Google Sheet แล้ว');
    return result;
  }catch(e){
    const msg=String(e&&e.message||e);
    const isConnectionIssue=msg.includes('เชื่อมต่อ API ไม่ได้')||msg.includes('รอผลนานเกินไป');
    if(isConnectionIssue && _retriesLeft>0){
      await new Promise(r=>setTimeout(r,1500));
      return apiPost(body,_retriesLeft-1);
    }
    hideSyncOverlayError(msg);
    throw e;
  }
}

function chunkItemsBySize_(items, makeBody, maxLen=4000){
  // v9.48 fix: เดิมแบ่งตาม "จำนวนรายการคงที่" (15 ชิ้น) ซึ่งไม่พอ เพราะข้อความภาษาไทยตอน encode ใส่ URL
  // จะยาวขึ้น 2-3 เท่า (ตัวอักษรไทย 1 ตัว กลายเป็น %XX%XX%XX ถึง 9 ตัวอักษร) ทำให้แค่ 15 รายการที่มี
  // remark ภาษาไทยยาวๆ ก็ยาวเกิน URL limit ได้แล้ว ตอนนี้วัดความยาวจริงหลัง encode ก่อนตัดสินใจแบ่งชุด
  const chunks=[]; let current=[];
  for(const item of items){
    const trial=current.concat([item]);
    const len=encodeURIComponent(JSON.stringify(makeBody(trial))).length;
    if(current.length && len>maxLen){ chunks.push(current); current=[item]; }
    else current=trial;
  }
  if(current.length) chunks.push(current);
  return chunks;
}
async function apiPostBatched(action, items, chunkSize, makeBody){
  // v9.46: ตัวกลางกันปัญหา URL ยาวเกินตอนส่งหลายรายการพร้อมกัน (ระบบนี้ฝัง payload ไว้ใน URL)
  // v9.48: เปลี่ยนจากแบ่งตามจำนวนคงที่ เป็นแบ่งตามขนาดจริงหลัง encode (ดู chunkItemsBySize_)
  const chunks=chunkItemsBySize_(items, makeBody);
  for(const chunk of chunks){
    const body=makeBody(chunk);
    body.action=action;
    await apiPost(body);
  }
}
async function pushMovementsOnly(movements, silent=true){
  const list=(movements||[]).filter(x=>x && !x.synced);
  if(!list.length) return;
  const payload=list.map(m=>{
    const q=(String(m.mode).toUpperCase()==='CYCLE_COUNT')?(+m.qty||0):Math.abs(+m.qty||0);
    return {MoveID:m.id,Timestamp:m.time,ItemType:m.type,SKU:m.sku,Mode:m.mode,Qty:q,Ref:m.ref||'',Remark:m.remark||'',StockAfter:m.stock||'',Source:'ERP-v8.3-BATCH'};
  });
  const pairs=list.map((m,i)=>({m,p:payload[i]}));
  // v9.48 fix: เปลี่ยนจากแบ่งตามจำนวนคงที่เป็นแบ่งตามขนาดจริงหลัง encode URL (ข้อความไทยใน Remark
  // ยาวขึ้นมากตอน encode ทำให้แค่จำกัดจำนวนรายการไม่พอ)
  try{
    const chunks=chunkItemsBySize_(pairs, chunk=>({action:'movementbatch',data:chunk.map(x=>x.p)}));
    for(const chunk of chunks){
      await apiPost({action:'movementbatch',data:chunk.map(x=>x.p)});
      chunk.forEach(x=>x.m.synced=true);
      saveLocalOnly();
    }
  }catch(e){
    // fallback: ชุดที่พังลองส่งทีละตัวแทน (เผื่อ Apps Script รุ่นเก่า หรือรายการใดรายการหนึ่งมีปัญหาเฉพาะตัว)
    const remaining=pairs.filter(x=>!x.m.synced);
    for(const x of remaining){
      await apiPost({action:'movement',data:x.p});
      x.m.synced=true;
    }
  }
  saveLocalOnly();
  if(!silent) sheetDone('บันทึก Movement เข้า Google Sheet เรียบร้อยแล้ว');
}

}

function dashboardValue(key, fallback=0){
  const r=(db.dashboard||[]).find(x=>String(x.Key)===String(key));
  if(!r) return fallback;
  const n=Number(r.Value);
  return isNaN(n)?(r.Value??fallback):n;

async function loadFromGoogleSheet(){
  // v9.99: ถ้าเพิ่ง sync ข้อมูลมาสดๆ จาก apiPost (ฝาก data มากับผลบันทึกแล้ว) ภายใน 4 วินาทีที่ผ่านมา
  // ข้อมูลใน db ก็ใหม่อยู่แล้ว ไม่ต้องยิง action=all ซ้ำอีกรอบ (ประหยัด 1 round-trip ที่ช้า 2-10 วิ ทุกครั้ง)
  if(Date.now()-lastFullSyncAt<4000){ render(); return; }
  if(apiBusy)return; apiBusy=true; showSyncOverlay('กำลังโหลดข้อมูลจาก Google Sheet...');
  try{const res=await apiGet('all'); fromSheetData(res.data||{}); saveLocalOnly(); lastFullSyncAt=Date.now(); render(); hideSyncOverlaySuccess('โหลดข้อมูลจาก Google Sheet แล้ว');}
  catch(e){console.error(e); hideSyncOverlayError('โหลดไม่สำเร็จ: '+(e.message||e));}
  finally{apiBusy=false;}
}
async function pushToGoogleSheet(silent=false){
  if(apiBusy){
    if(!silent) toast('ระบบกำลัง Sync อยู่ รอสักครู่');
    else scheduleAutoPush();
    return;
  }
  apiBusy=true;
  if(!silent) toast('กำลังบันทึกเฉพาะรายการค้างส่งขึ้น Google Sheet...');
  try{
    const pendingMov=(db.mov||[]).filter(x=>!x.synced).map(m=>({
      MoveID:m.id,Timestamp:m.time,ItemType:m.type,SKU:m.sku,Mode:m.mode,
      Qty:(String(m.mode).toUpperCase()==='CYCLE_COUNT')?(+m.qty||0):Math.abs(+m.qty||0),
      Ref:m.ref||'',Remark:m.remark||'',StockAfter:m.stock||'',Source:'ERP-fast-sync'
    }));
    const payload={
      movements:pendingMov,
      productionOrder:(db.po||[]).map(poPayload),
      orders:(db.orderDays||[]).map(orderPayload),
      orderItems:(db.orderDays||[]).flatMap(o=>(o.shortages||[]).map(s=>orderItemPayload(o.date,s)))
    };
    const total=pendingMov.length+payload.productionOrder.length+payload.orders.length+payload.orderItems.length;
    if(total===0){
      toast('ไม่มีรายการค้างส่งขึ้น Google Sheet');
      return;
    }
    await apiPost({action:'flushpending',data:payload});
    (db.mov||[]).forEach(m=>{ if(!m.synced) m.synced=true; });

function shipCheckTable(rows,date){

    const total=salesOutTotal(r);

    const wasShort=shipHasAutoPO(r.date||date,r.sku);

function updateShipStatus(sku,stock){
  const total=SALES_CHANNELS.reduce((a,[k])=>a+(+($('so_'+k+'_'+sku)?.value||0)),0);

  const diffEl=$('ship_diff_'+sku); if(diffEl){ diffEl.textContent=diff; diffEl.className='pill '+(diff<0?'bad':'good'); }
  const statusEl=$('ship_status_'+sku); if(statusEl){ statusEl.innerHTML=diff<0?'<span class="pill bad">Production</span>':'<span class="pill good">OK</span>'; }

function shipShortTable(rows){
  const arr=rows.map(r=>({...r,total:salesOutTotal(r),diff:r.stock-salesOutTotal(r)})).filter(r=>r.diff<0).sort((a,b)=>a.diff-b.diff);
  if(!arr.length) return '<p class="hint">Stock พอส่งทั้งหมด</p>';

function currentShippingShortageRows(){
  const date=$('soDate')?.value||todayISO();
  // v9.69 fix: เดิมต้องกด "บันทึกขายออก" ก่อนถึงจะสร้างคำสั่งผลิตจากรายการที่ขาดได้ (ข้ามขั้นตอนไม่ได้)
  // เพราะอ่านจากข้อมูลที่บันทึกแล้วในชีตอย่างเดียว ตอนนี้เอาข้อมูลที่บันทึกไว้แล้ว (ครบทุก Product)
  // มาผสมกับตัวเลขที่พิมพ์อยู่บนจอตอนนี้ (เฉพาะ SKU ที่กำลังแสดงอยู่ ยังไม่ได้กดบันทึก) เข้าด้วยกัน
  // ทำให้กดสั่งผลิตได้ทันทีโดยไม่ต้องบันทึกก่อน แต่ยังครบทุก Product เหมือนเดิม
  const liveRows=collectSalesOutRows();
  const liveMap={}; liveRows.forEach(r=>liveMap[String(r.sku)]=r);
  return salesOutRows(date).map(r=>{
    const live=liveMap[String(r.sku)];
    const row=live?{...r,...live}:r;
    const total=salesOutTotal(row);
    return {date,sku:r.sku,name:r.name,product:r.product,total,stock:r.stock,need:Math.max(0,total-r.stock)};
  }).filter(r=>r.need>0);
}

function tkGet(o,name){const key=name.toLowerCase().replace(/\s+/g,''); const kk=Object.keys(o).find(x=>x.replace(/\s+/g,'')===key); return kk?String(o[kk]||'').trim():'';}
function tiktokMapKey(name,variant){return (String(name||'').trim()+'||'+String(variant||'').trim()).toLowerCase();}
function normText(s){return String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9฀-๿]+/g,' ').trim();}
function guessTiktokSku(name,variant){
  db.tiktokSkuMap=db.tiktokSkuMap||{};
  const saved=db.tiktokSkuMap[tiktokMapKey(name,variant)];
  if(saved && (db.items||[]).some(x=>x.sku===saved)) return saved;
  // จับคู่เฉพาะกรณีชื่อ variant ตรงกันเป๊ะ (หลัง normalize) เท่านั้น — กันเดาผิดจากคำทั่วไปที่ซ้ำกันโดยบังเอิญ
  // (เช่น "protein" โผล่ทั้งใน Miyong กับ Protein Stick) กรณีไม่ตรงเป๊ะให้เว้นว่างไว้ให้เลือกเอง
  // แล้วระบบจะจำคู่ที่เลือกไว้ใน db.tiktokSkuMap ให้ใช้ auto ในการนำเข้าครั้งถัดไป
  const nVariant=normText(variant);
  if(!nVariant || nVariant.length<3) return '';
  const matches=(db.items||[]).filter(x=>normText(x.variant)===nVariant);
  return matches.length===1?matches[0].sku:'';
}
function importTiktokCSVFile(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let rows; try{ rows=parseTableText(r.result); }catch(err){ console.error(err); return alertModal('อ่านไฟล์ CSV ไม่สำเร็จ: '+(err.message||err)); }
    if(!rows.length) return alertModal('ไม่พบข้อมูลในไฟล์ CSV');
    const groupMap=new Map(); let skippedCancelled=0;
    rows.forEach(o=>{
      const status=tkGet(o,'order status').toLowerCase(), substatus=tkGet(o,'order substatus').toLowerCase();
      if(status.includes('cancel')||substatus.includes('cancel')){ skippedCancelled++; return; }
      const name=tkGet(o,'product name'), variant=tkGet(o,'variation'), sellerSku=tkGet(o,'seller sku');
      const qty=+tkGet(o,'quantity')||0;
      if((!name && !sellerSku)||qty<=0) return;
      const key=sellerSku?('SELLERSKU::'+sellerSku.toLowerCase()):tiktokMapKey(name,variant);
      if(!groupMap.has(key)) groupMap.set(key,{name,variant,sellerSku,qty:0});
      groupMap.get(key).qty+=qty;
    });
    if(!groupMap.size) return alertModal('ไม่พบรายการสินค้าที่นำเข้าได้ในไฟล์นี้'+(skippedCancelled?' (ข้ามออเดอร์ที่ยกเลิก '+skippedCancelled+' แถว)':''));
    openTiktokImportPreview([...groupMap.values()], skippedCancelled);
  };
  r.readAsText(f);
}
function openTiktokImportPreview(groups, skippedCancelled){
  const date=$('soDate')?.value||todayISO();
  const fgOptions=(db.items||[]).slice().sort((a,b)=>String(a.sku).localeCompare(String(b.sku)));
  const rowsHtml=groups.map((g,i)=>{
    const guess=g.sellerSku?((db.items||[]).find(x=>String(x.sku).toLowerCase()===g.sellerSku.toLowerCase())?.sku||''):guessTiktokSku(g.name,g.variant);
    const opts='<option value="">-- เลือก SKU --</option>'+fgOptions.map(x=>`<option value="${escHTML(x.sku)}" ${x.sku===guess?'selected':''}>${escHTML(x.sku)} — ${escHTML(x.name)}</option>`).join('');
    return `<tr><td>${escHTML(g.name)}${g.sellerSku?' <span class="mini">(SellerSKU: '+escHTML(g.sellerSku)+')</span>':''}</td><td>${escHTML(g.variant)}</td><td>${g.qty}</td><td><select id="tkMap_${i}" style="min-width:220px">${opts}</select></td></tr>`;
  }).join('');
  const skippedMsg=skippedCancelled?`<p class="mini">ข้ามออเดอร์ที่ยกเลิก ${skippedCancelled} แถว</p>`:'';

function confirmTiktokImport(groups){

    if(!g.sellerSku) db.tiktokSkuMap[tiktokMapKey(g.name,g.variant)]=sku;
  });
  const skus=Object.keys(aggregated);
  if(!skus.length) return toast('ไม่ได้เลือก SKU ให้รายการใดเลย');

    else { const row={date,sku,remark:'Import TikTok CSV'}; SALES_CHANNELS.forEach(([k])=>row[k]=k==='tiktok'?aggregated[sku]:0); db.salesOut.push(row); }

}

/* ===== ขายออก (SalesOut) — บันทึกยอดขายจริงต่อช่องทาง + ตัด Stock ทันที (คนละหน้ากับ ShippingPlan) ===== */
const SALES_CHANNELS=[['baimiang','BaiMiang'],['b2b','B2B'],['tiktok','TikTok'],['shopee','Shopee'],['lazada','Lazada'],['line','Line'],['grab','Grab']];
function salesOutKey(date,sku){return String(date||'')+'||'+String(sku||'');}
function salesOutRows(date){
  db.salesOut=db.salesOut||[];
  const map=new Map((db.salesOut||[]).filter(x=>x.date===date).map(x=>[salesOutKey(x.date,x.sku),x]));
  const rows=[];
  (db.items||[]).forEach(it=>{
    const s=map.get(salesOutKey(date,it.sku));
    const row={date,sku:it.sku,product:it.product||'',name:it.name||'',stock:shipStock(it.sku),remark:s?.remark||''};
    SALES_CHANNELS.forEach(([k])=>row[k]=+(s?.[k]||0));
    rows.push(row);
  });
  return rows;
}
function salesOutTotal(row){return SALES_CHANNELS.reduce((a,[k])=>a+(+row[k]||0),0);}
function salesRevenueForDate(date){
  return (db.items||[]).reduce((sum,it)=>{
    const rec=(db.salesOut||[]).find(x=>x.date===date && String(x.sku)===String(it.sku));
    if(!rec) return sum;
    const qty=SALES_CHANNELS.reduce((a,[k])=>a+(+rec[k]||0),0);
    return sum + qty*(+it.price||0);
  },0);
}
function salesQtyByChannelForRange(days){

function gridKeyNav(e,el){
  // ทุกหน้าที่มีตารางกรอกตัวเลขหลายแถว: กด Enter = ไปแถวถัดไปคอลัมน์เดิม, Shift+Enter = แถวก่อนหน้า
  // Tab ไปคอลัมน์ถัดไปใช้พฤติกรรมเบราว์เซอร์ปกติอยู่แล้ว (เรียงตามลำดับ input ในตาราง)
  if(e.key!=='Enter') return;
  e.preventDefault();
  const td=el.closest('td'); const tr=td?.closest('tr');
  if(!td||!tr) return;
  const cellIndex=Array.from(tr.children).indexOf(td);
  let row=e.shiftKey?tr.previousElementSibling:tr.nextElementSibling;
  while(row){
    const cell=row.children[cellIndex];
    const input=cell?.querySelector('input,select,textarea');
    if(input){ input.focus(); if(input.select) input.select(); return; }
    row=e.shiftKey?row.previousElementSibling:row.nextElementSibling;
  }
}

function todayISO(){
  const d=new Date();
  return `${d.getFullYear()}-${erpPad(d.getMonth()+1)}-${erpPad(d.getDate())}`;
}
function dateISO(t){
  if(t===null || t===undefined || t==='') return '';
  if(typeof t==='number' || /^\d+(\.\d+)?$/.test(String(t).trim())){
    const d=excelSerialToDate(t);
    if(!d || isNaN(d)) return '';
    return `${d.getFullYear()}-${erpPad(d.getMonth()+1)}-${erpPad(d.getDate())}`;
  }
  let s=String(t||'').trim();
  // ISO หรือ yyyy-mm-dd / yyyy/mm/dd รวมกรณีปี พ.ศ. 2569 จาก Google Sheet
  let iso=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(iso){
    let y=+iso[1], mo=+iso[2], da=+iso[3];
    if(y>2400) y-=543;
    return String(y).padStart(4,'0')+'-'+erpPad(mo)+'-'+erpPad(da);
  }
  // รองรับ Google Form แบบ M/D/YYYY และไทยแบบ D/M/YYYY
  let m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){
    let a=+m[1], b=+m[2], y=+m[3];
    if(y>2400)y-=543;
    let mo, da;
    if(b>12){ mo=a; da=b; }      // M/D/YYYY เช่น 7/2/2026
    else if(a>12){ da=a; mo=b; } // D/M/YYYY เช่น 28/6/2026
    else { mo=a; da=b; }         // ถ้ากำกวม ใช้ M/D เพราะข้อมูล Google Form เป็นแนวนี้
    return String(y).padStart(4,'0')+'-'+erpPad(mo)+'-'+erpPad(da);
  }
  let d=new Date(s);
  if(isNaN(d)) return '';
  let y=d.getFullYear();
  if(y>2400) y-=543;
  return String(y).padStart(4,'0')+'-'+erpPad(d.getMonth()+1)+'-'+erpPad(d.getDate());
}

const DEFAULT_PROD_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSYNme5DqGdSFscQTOcVPBDC5cSjiBQ2Ag_tYFBjgEt7PH-WqnOqMB8V7B2WllQ0IFQoE0JA-ZZkUrA/pub?gid=1949740572&single=true&output=csv';

async function fetchCsvText(url){
  const clean=String(url||'').trim();
  const targets=[
    clean,
    'https://api.allorigins.win/raw?url='+encodeURIComponent(clean),
    'https://corsproxy.io/?'+encodeURIComponent(clean)
  ];
  let lastErr=null;
  for(const u of targets){
    try{
      const res=await fetch(u,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text=await res.text();
      if(text && text.includes('รหัสสินค้า')) return text;
      if(text && text.toLowerCase().includes('sku')) return text;
      if(text && text.length>20) return text;
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error('Cannot fetch CSV');
}

function parseCsvRows(text){
  const rows=[]; let row=[], cur='', q=false;
  text=String(text||'').replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c==='"'){
      if(q && n==='"'){cur+='"'; i++;}
      else q=!q;
    }else if(c===',' && !q){row.push(cur); cur='';}
    else if((c==='\n' || c==='\r') && !q){
      if(c==='\r' && n==='\n') i++;
      row.push(cur); cur='';
      if(row.some(v=>String(v).trim()!=='')) rows.push(row);
      row=[];
    }else cur+=c;
  }
  row.push(cur);
  if(row.some(v=>String(v).trim()!=='')) rows.push(row);
  return rows.map(r=>r.map(v=>String(v||'').trim()));
}

function parseProductionCsv(text){
  const rows=parseCsvRows(text);
  if(rows.length<2) return [];
  const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
  const find=(keys)=>{
    for(const k of keys){
      const kk=k.toLowerCase();
      let i=headers.findIndex(h=>h===kk || h.includes(kk));
      if(i>=0) return i;
    }
    return -1;
  };
  const iTime=find(['timestamp','ประทับเวลา','เวลา']);
  const iSku=find(['รหัสสินค้า','sku','skuid']);
  const iProd=find(['หมวดหมู่สินค้า','หมวด','product','category']);
  const iQty=find(['จำนวนที่ผลิตได้','จำนวน','qty','quantity']);
  const iExp=find(['expiry date','วันหมดอายุ','หมดอายุ','expiry']);
  const iOp=find(['ชื่อผู้บันทึก','ผู้บันทึก','operator','ชื่อ']);
  const iRem=find(['หมายเหตุ','remark','note']);
  const iPhoto=find(['แนบรูปภาพสินค้า','รูป','photo','image']);
  const iMfgDate=find(['วันที่ผลิต','mfg date','production date']);
  const iMfgTime=find(['เวลาที่ผลิต','mfg time','production time']);
  if(iSku<0 || iQty<0) return [];
  const out=[];
  rows.slice(1).forEach((r,idx)=>{
    const sku=(r[iSku]||'').trim();
    const rawQty=String(r[iQty]||'').replace(/,/g,'').trim();
    const qty=Number(rawQty);
    if(!sku || !qty) return;
    const timestamp=(iTime>=0?r[iTime]:'') || (iMfgDate>=0?r[iMfgDate]:'') || now();
    out.push({
      id:'GS-'+idx+'-'+sku+'-'+rawQty+'-'+String(timestamp).replace(/\W/g,''),
      timestamp,
      sku,
      product:iProd>=0?r[iProd]:'',
      qty,
      expiry:iExp>=0?r[iExp]:'',
      operator:iOp>=0?r[iOp]:'',
      remark:iRem>=0?r[iRem]:'',
      photo:iPhoto>=0?r[iPhoto]:'',
      mfgDate:iMfgDate>=0?r[iMfgDate]:'',
      mfgTime:iMfgTime>=0?r[iMfgTime]:'',
      source:'Google Sheet CSV'
    });
  });
  return out;
}

    // ปุ่มนี้ตอนนี้แค่โชว์ตาราง preview เฉยๆ ไม่แตะ Stock จริงในแอปอีกต่อไป (ปลอดภัย ไม่ทำให้เพี้ยน)

function productionSkuSummaryTable(rows){

function updateProdRecReq(sku){let q=+$('prodrecqty_'+sku)?.value||0; let batchVal=$('prodrecbatch_'+sku)?.value; let el=$('prodreq_'+sku); if(el)el.innerHTML=reqText(sku,q,batchVal);}
function onProdRecQtyInput(sku){
  // v9.88: พิมพ์จำนวนที่ผลิตได้จริงแล้วเดา Batch ให้ (ปัดขึ้น) แต่แก้เป็นทศนิยมเองได้ (ผสมไม่เต็ม Batch ก็ใส่ได้)
  const batchYield=getBatchYield(sku);
  const qEl=$('prodrecqty_'+sku), bEl=$('prodrecbatch_'+sku);

async function saveProductionRecord(){
  const rows=[...document.querySelectorAll('.prodRecChk:checked')].map(c=>({sku:c.dataset.sku,qty:+$('prodrecqty_'+c.dataset.sku).value||0,actualBatches:$('prodrecbatch_'+c.dataset.sku)?.value||''})).filter(x=>x.qty>0);
  if(!rows.length)return toast('ติ๊ก SKU และใส่จำนวนผลิตก่อน');
  const ts=now(), operator=$('recOperator')?.value||'', expiry=$('recExpiry')?.value||'', remark=$('recRemark')?.value||'';
  const logs=rows.map((r,i)=>{let it=db.items.find(x=>x.sku==r.sku)||{}; return {LogID:'PR-'+Date.now()+'-'+i+'-'+r.sku,Timestamp:ts,SKU:r.sku,Product:it.product||'',Qty:r.qty,ExpiryDate:expiry,Operator:operator,Remark:remark,Photo:'',Source:'ERP-Manual',ActualBatches:r.actualBatches};});
  toast('กำลังบันทึกผลผลิต '+logs.length+' รายการเข้า Google Sheet...');
  try{
    await saveProductionBatchDirect(logs);
    logs.forEach(l=>{
      db.prodLog=db.prodLog||[]; db.prodLog.push({id:l.LogID,timestamp:l.Timestamp,sku:l.SKU,product:l.Product,qty:+l.Qty||0,expiry:l.ExpiryDate,operator:l.Operator,remark:l.Remark,photo:'',source:l.Source,actualBatches:l.ActualBatches});
      // v9.90 fix: SKU ที่ตั้ง Batch Yield ไว้ ต้องเข้า WIP ก่อน (รอแพ็ค) ไม่ใช่ FG ตรงๆ เหมือน SKU ปกติ
      const batchYield=getBatchYield(l.SKU);
      const fg=db.items.find(x=>x.sku==l.SKU);
      const creditField=batchYield>1?'wipStock':'stock';
      if(fg) fg[creditField]=(+fg[creditField]||0)+(+l.Qty||0);
      const fgMove={id:'MV-'+Date.now()+'-FG-'+l.SKU,time:ts,type:batchYield>1?'WIP':'FG',sku:l.SKU,mode:'IN',qty:+l.Qty||0,ref:l.LogID,remark:batchYield>1?'Production record (รอแพ็ค)':'Production record',stock:fg?fg[creditField]:'',synced:true};
      db.mov.push(fgMove);
      const batches=(l.ActualBatches!==undefined&&l.ActualBatches!=='')?+l.ActualBatches:(+l.Qty||0)/batchYield;
      (db.bom[l.SKU]||[]).filter(b=>(b.stage||'Production')==='Production').forEach(b=>{let rm=db.rm.find(x=>x.sku==b.sku); let used=(+b.qty||0)*batches; if(rm) rm.stock=(+rm.stock||0)-used; db.mov.push({id:'MV-'+Date.now()+'-RM-'+b.sku,time:ts,type:'RM',sku:b.sku,mode:'OUT',qty:-used,ref:l.LogID,remark:'BOM issue by production record',stock:rm?rm.stock:'',synced:true});});
    });
    saveLocalOnly(); render(); sheetDone('บันทึกผลผลิตสำเร็จ '+logs.length+' รายการ / ตัด BOM แล้ว');
  }catch(e){console.error(e); alertModal('บันทึกผลผลิตไม่สำเร็จ / ยังไม่บันทึกใน ERP: '+(e.message||e));}
}

function trxStatusPill(s){s=String(s||'Active'); return s.toLowerCase()==='voided'?'<span class="pill bad">Voided</span>':'<span class="pill good">Active</span>';}
function genericStatusPill(s){
  s=String(s||'-');
  const cls={'Approved':'good','Active':'good','Rejected':'bad','Disabled':'bad','Voided':'bad'}[s]||'';
  return `<span class="pill ${cls}">${s}</span>`;
}
function productionTransactions(){
  // v9.91 fix: เดิม label ว่า "FG" เสมอ ทั้งที่ SKU ที่ตั้ง Batch Yield ไว้ จริงๆ แล้วเข้า WIP ไม่ใช่ FG
  // ทำให้ดู Transaction แล้วงงว่า Void อะไรไปกันแน่ ตอนนี้บอกตรงตามที่เกิดขึ้นจริง
  const fromLog=(db.prodLog||[]).map(r=>{let it=(db.items||[]).find(x=>String(x.sku)==String(r.sku))||{}; const kind=getBatchYield(r.sku||r.SKU)>1?'WIP':'FG'; return {id:r.id||r.LogID||'',time:r.timestamp||r.Timestamp||'',type:r.source||r.Source||'Production',kind,sku:r.sku||r.SKU||'',name:it.name||'',product:it.product||r.product||r.Product||'',variant:it.variant||it.weight||'',qty:+(r.qty||r.Qty||0),operator:r.operator||r.Operator||'',remark:r.remark||r.Remark||'',status:r.status||r.Status||'Active',voidReason:r.voidReason||r.VoidReason||'',voidAt:r.voidAt||r.VoidAt||''};});
  // v9.39 fix: กันเหนียวเผื่อ QR scan บางรายการอยู่ใน StockMovement แต่ไม่มาโผล่ใน ProductionLog
  // (เช่น ช่วง sync ไม่สมบูรณ์) ดึงมาโชว์เพิ่มด้วย กันไม่ให้หายไปจากหน้านี้เฉยๆ
  const seenIds=new Set(fromLog.map(x=>String(x.id)));
  const fromMovAuto=(db.mov||[]).filter(mv=>String(mv.source||'')==='GoogleFormCSV-auto' && String(mv.type||'').toUpperCase()==='FG' && mv.ref && !seenIds.has(String(mv.ref)))
    .map(mv=>{let it=(db.items||[]).find(x=>String(x.sku)==String(mv.sku))||{}; return {id:mv.ref,time:mv.time,type:'QR / Google Form (movement)',kind:'FG',sku:mv.sku,name:it.name||'',product:it.product||'',variant:it.variant||'',qty:+mv.qty||0,operator:'',remark:mv.remark||'',status:'Active',voidReason:'',voidAt:''};});
  // v9.91: เพิ่มรายการ "แพ็คสินค้า" (WIP -> FG) เข้ามาโชว์ในประวัติด้วย (เดิมไม่โผล่ในหน้านี้เลย)
  const fromPack=(db.mov||[]).filter(mv=>String(mv.source||'')==='ERP-PACK' && String(mv.type||'').toUpperCase()==='FG')
    .map(mv=>{let it=(db.items||[]).find(x=>String(x.sku)==String(mv.sku))||{}; return {id:mv.ref||mv.id||'',time:mv.time,type:'แพ็คสินค้า (WIP → FG)',kind:'PACK',sku:mv.sku,name:it.name||'',product:it.product||'',variant:it.variant||'',qty:+mv.qty||0,operator:'',remark:mv.remark||'',status:'Active',voidReason:'',voidAt:''};});
  // v9.44: เพิ่ม Transaction ของวัตถุดิบ (RM) เข้ามาด้วย พร้อมปุ่ม Void (สร้างรายการย้อนกลับ ไม่ลบของเดิม)
  const voidRefs=new Set((db.mov||[]).filter(mv=>String(mv.source||'')==='ERP-VOID-RM' && mv.ref).map(mv=>String(mv.ref)));
  const fromRM=(db.mov||[]).filter(mv=>String(mv.type||'').toUpperCase()==='RM')
    .map(mv=>{let rmIt=(db.rm||[]).find(x=>String(x.sku)==String(mv.sku))||{}; const isVoidReverse=String(mv.source||'')==='ERP-VOID-RM'; const alreadyVoided=voidRefs.has('VOID-'+String(mv.id||'')); return {id:mv.id||mv.ref||'',time:mv.time,type:'วัตถุดิบ: '+(mv.mode||''),kind:'RM',sku:mv.sku,name:rmIt.name||'',product:rmIt.product||'Raw Material',variant:rmIt.variant||'',qty:+mv.qty||0,operator:'',remark:mv.remark||'',status:'Active',voidReason:'',voidAt:'',isVoidReverse,alreadyVoided};});
  const withVoidReq=fromLog.concat(fromMovAuto,fromPack,fromRM).map(x=>({...x,voidRequest:findVoidRequestFor(x.id)}));
  return withVoidReq;
}
function findVoidRequestFor(refId){
  const reqs=(db.voidRequests||[]).filter(r=>String(r.refId)===String(refId));
  if(!reqs.length) return null;
  return reqs.slice().sort((a,b)=>trxSortKey(b.requestedAt)-trxSortKey(a.requestedAt))[0];
}
function voidStatusCell(x){
  const req=x.voidRequest;
  if(req && req.status==='Pending') return '<span class="pill" style="background:#fff3cd;color:#7a5b00">รออนุมัติ</span><br><span class="mini">ขอโดย '+escHTML(req.requestedBy||'')+'</span>';
  if(req && req.status==='Rejected') return '<span class="pill bad">ปฏิเสธ</span><br><span class="mini">'+escHTML(req.rejectReason||'ไม่ระบุเหตุผล')+'</span>';
  if(req && req.status==='Approved') return trxStatusPill('Voided')+'<br><span class="mini">อนุมัติโดย '+escHTML(req.approvedBy||'')+'</span>';
  return trxStatusPill(x.status)+(x.voidReason?'<br><span class="mini">'+escHTML(x.voidReason)+'</span>':'');
}
function trxSortKey(t){const d=new Date(t); return isNaN(d)?0:d.getTime();}

function transactionTable(arr){
  if(!arr.length)return '<p class="hint">ไม่พบรายการ</p>';
  const anyVoidable=arr.some(x=>{
    if(x.voidRequest && x.voidRequest.status==='Pending') return false;
    if(x.kind==='FG'||x.kind==='WIP') return String(x.status||'Active')!=='Voided';
    if(x.kind==='RM') return !x.isVoidReverse && !x.alreadyVoided;
    return false;
  });
  const kindLabel={FG:'📦 FG (พร้อมขาย)',WIP:'🧪 WIP (รอแพ็ค)',RM:'🧺 วัตถุดิบ',PACK:'📮 แพ็คสินค้า'};
  const bulkBar=anyVoidable?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="trxSelectAll" onchange="toggleAllTrxChk(this.checked)" style="width:20px;height:20px"> เลือกทั้งหมด</label><button class="danger" onclick="voidTrxBulk()">${isAdmin()?'Void':'ขอ Void'}ที่เลือกทั้งหมด</button></div>`:'';
  return bulkBar+`<table><tr><th style="width:36px"></th><th>เวลา</th><th>LogID</th><th>ประเภท</th><th>Source</th><th>SKU</th><th>Product</th><th>Variant</th><th>Qty</th><th>ผู้บันทึก</th><th>Status</th><th></th></tr>${arr.map(x=>{
    let actionCell='', chkCell='', qtyNote='';
    const pendingReq=x.voidRequest && x.voidRequest.status==='Pending';
    if(pendingReq){
      actionCell='<span class="mini">รอ Admin อนุมัติ</span>';
    }else if((x.kind==='FG'||x.kind==='WIP') && String(x.status||'Active')!=='Voided'){
      actionCell=`<button class="small danger" onclick="voidProductionPrompt('${escHTML(x.id)}')">${isAdmin()?'Void':'ขอ Void'}</button>`;
      chkCell=`<input type="checkbox" class="trxChk" data-kind="FG" data-sku="${escHTML(x.sku)}" data-qty="${x.qty}" value="${escHTML(x.id)}" style="width:20px;height:20px">`;
    }else if(x.kind==='RM'){
      if(x.isVoidReverse){ actionCell='<span class="mini">รายการย้อนกลับ</span>'; }
      else if(x.alreadyVoided){ actionCell='<span class="mini">Void แล้ว</span>'; qtyNote='<br><span class="mini good">(คืนแล้ว ✅)</span>'; }
      else {
        actionCell=`<button class="small danger" onclick="voidRMMovementPrompt('${escHTML(x.id)}')">${isAdmin()?'Void':'ขอ Void'}</button>`;
        chkCell=`<input type="checkbox" class="trxChk" data-kind="RM" data-sku="${escHTML(x.sku)}" data-qty="${x.qty}" value="${escHTML(x.id)}" style="width:20px;height:20px">`;
      }
    }else if(x.kind==='PACK'){
      actionCell='<span class="mini">-</span>';
    }
    return `<tr><td>${chkCell}</td><td>${x.time}</td><td><b>${x.id}</b></td><td>${kindLabel[x.kind]||x.kind}</td><td>${x.type}</td><td><b>${x.sku}</b><br><span class="mini">${escHTML(x.name)}</span></td><td>${escHTML(x.product)}</td><td>${escHTML(x.variant)}</td><td><b>${roundDisplay(x.qty)}</b>${qtyNote}</td><td>${escHTML(x.operator)}</td><td>${voidStatusCell(x)}</td><td>${actionCell}</td></tr>`;
  }).join('')}</table>`;
}

async function voidTrxBulk(){

  const reason=await promptModal('เหตุผลการ'+(isAdmin()?'Void':'ขอ Void')+' (ใช้ร่วมกันทั้ง '+chks.length+' รายการ)');

  if(!reasonTrim) return toast('ต้องใส่เหตุผลก่อน');
  if(!await confirmModal((isAdmin()?'Void':'ส่งคำขอ Void')+' '+chks.length+' รายการที่เลือกไว้?'))return;
  toast('กำลังดำเนินการ '+chks.length+' รายการ...');
  let okCount=0, failList=[];
  for(const c of chks){

}

let tiktokImportGrouped=[];

function handleTiktokFile(input){
  const file=input.files[0];
  if(!file) return;
  if(typeof Papa==='undefined'){ alertModal('โหลดตัวช่วยอ่านไฟล์ CSV ไม่สำเร็จ ลองรีเฟรชหน้าใหม่'); return; }
  toast('กำลังอ่านไฟล์...');
  Papa.parse(file,{header:true,skipEmptyLines:true,complete:(res)=>processTiktokRows(res.data),error:(err)=>alertModal('อ่านไฟล์ไม่สำเร็จ: '+err.message)});
}
function processTiktokRows(rows){
  const valid=rows.filter(r=>!String(r['Order Status']||'').toLowerCase().includes('cancel'));
  const groups={};
  valid.forEach(r=>{
    const name=(r['Product Name']||'').trim();
    const variant=(r['Variation']||'').trim();
    const qty=+(r['Quantity']||0);
    if(!name||!qty) return;
    const key=name+'|'+variant;
    if(!groups[key]) groups[key]={name,variant,qty:0};
    groups[key].qty+=qty;
  });
  tiktokImportGrouped=Object.keys(groups).map(k=>({key:k,...groups[k]}));
  if(!tiktokImportGrouped.length) return toast('ไม่พบรายการที่ใช้ได้ในไฟล์นี้ (เช็คว่าเป็นไฟล์ To Ship Order ของ TikTok ไหม)');
  renderTiktokMapping();
}
function renderTiktokMapping(){
  const skuOptions=db.items.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${x.sku}">${escHTML(x.name)} (${x.sku})</option>`).join('');
  const rowsHtml=tiktokImportGrouped.map((g,i)=>{
    const existing=(db.channelSkuMap||[]).find(m=>m.channel==='TikTok'&&m.externalKey===g.key);
    return `<tr><td>${escHTML(g.name)}</td><td>${escHTML(g.variant)}</td><td><b>${g.qty}</b></td><td>${existing?`<span class="pill good">${escHTML(itemName(existing.sku))} (${existing.sku})</span>`:`<select id="tiktokmap_${i}"><option value="">-- เลือก SKU --</option>${skuOptions}</select>`}</td></tr>`;
  }).join('');
  $('tiktokImportResult').innerHTML=`<div class="box"><h2>พบ ${tiktokImportGrouped.length} รายการ (สินค้า+รสชาติ) จากไฟล์</h2><table><tr><th>ชื่อสินค้า (TikTok)</th><th>รสชาติ/ตัวเลือก</th><th>จำนวนรวม</th><th>จับคู่ SKU</th></tr>${rowsHtml}</table><br><button class="primary" onclick="confirmImportTiktok()">บันทึกยอดขายเข้าระบบ</button></div>`;
}
async function confirmImportTiktok(){
  if(!tiktokImportGrouped.length) return toast('ไม่มีข้อมูลให้บันทึก');
  const date=$('tiktokDate')?.value||todayISO();
  const newMappings=[];
  const skuQty={};
  for(let i=0;i<tiktokImportGrouped.length;i++){
    const g=tiktokImportGrouped[i];
    const existing=(db.channelSkuMap||[]).find(m=>m.channel==='TikTok'&&m.externalKey===g.key);
    let sku=existing?.sku;
    if(!sku){
      sku=$('tiktokmap_'+i)?.value;
      if(!sku){ alertModal('กรุณาเลือก SKU ให้ครบทุกรายการก่อน (แถวที่ '+(i+1)+': '+g.name+' - '+g.variant+' ยังไม่ได้เลือก)'); return; }
      newMappings.push({channel:'TikTok',externalKey:g.key,externalLabel:g.name+' - '+g.variant,sku});
    }
    skuQty[sku]=(skuQty[sku]||0)+g.qty;
  }
  toast('กำลังบันทึก...');
  try{
    if(newMappings.length){
      await apiPostBatched('savechannelskumap', newMappings, 8, chunk=>({rows:chunk}));
      newMappings.forEach(nm=>{ db.channelSkuMap=db.channelSkuMap||[]; db.channelSkuMap.push(nm); });
    }
    const rows=Object.keys(skuQty).map(sku=>{
      const existingRow=(db.salesOut||[]).find(r=>r.date===date&&String(r.sku)===String(sku));
      const base=existingRow?{...existingRow}:{date,sku,baimiang:0,b2b:0,tiktok:0,shopee:0,lazada:0,line:0,grab:0,remark:''};
      base.tiktok=(+base.tiktok||0)+skuQty[sku];
      return base;
    });
    const totalDeducted=await persistSalesOutRows(rows,date);
    tiktokImportGrouped=[];
    await loadFromGoogleSheet();
    page='shipcheck'; render();
    sheetDone('นำเข้า TikTok สำเร็จ '+Object.keys(skuQty).length+' SKU / ตัด Stock '+totalDeducted+' รายการ');
  }catch(e){
    console.error(e); alertModal('นำเข้าไม่สำเร็จ: '+(e.message||e));
  }
}

async function copyKioskLink(stationId){
  toast('กำลังขอลิงก์...');
  try{
    // v9.101: เดิมใช้ apiPost (เส้นทาง fastwrite) ซึ่งจะพ่วงโหลดข้อมูลทั้งระบบ (getAllData) กลับมาด้วยเสมอ
    // ทั้งที่ปุ่มนี้แค่ต้องการ Token สั้นๆ อันเดียว ทำให้กดคัดลอกลิงก์ทีนึงช้าเท่าโหลดทั้งแอปใหม่
    // เปลี่ยนไปยิง action เบาๆ ตรงๆ (ยังต้อง login/session เหมือนเดิม แค่ไม่พ่วงข้อมูลทั้งชุดกลับมา)
    const res=await apiGetOnce('getstationtoken',{stationId});
    const stationName=(db.stations||[]).find(s=>s.id===stationId)?.name||'';
    const url=new URL(location.href);
    url.search='';
    url.searchParams.set('kiosk','1');
    url.searchParams.set('station',stationId);
    url.searchParams.set('token',res.token);
    if(stationName) url.searchParams.set('name',stationName);
    if(apiKey) url.searchParams.set('key',apiKey);
    const link=url.toString();
    try{
      await navigator.clipboard.writeText(link);
      sheetDone('คัดลอกลิงก์แล้ว เอาไปเปิดที่ Tablet ของ Station นี้ได้เลย');
    }catch(copyErr){
      await promptModal('คัดลอกอัตโนมัติไม่ได้ (เบราว์เซอร์นี้ไม่อนุญาต) คัดลอกด้วยมือจากช่องนี้แทน:',link);
    }
  }catch(e){console.error(e); alertModal('ขอลิงก์ไม่สำเร็จ: '+(e.message||e));}
}

/* === v9.95: สั่งผลิตอัตโนมัติ — เทียบ Stock กับ Min Stock (คำนวณฝั่ง browser จาก db.items ที่โหลดมาแล้ว
 * ไม่ต้องเรียก API เพิ่มสำหรับส่วนคำนวณ) แล้วให้ Admin เลือก Station + ปรับจำนวนก่อนยืนยันจริงเสมอ
 * ไม่มีการสร้าง Production Order อัตโนมัติโดยไม่มีคนเห็นก่อน — กดยืนยันเท่านั้นถึงจะเข้าคิว Kiosk จริง
 */
function autoProductionSuggestions(){
  return (db.items||[])
    .filter(x=>String(x.status||'Active')==='Active')
    .map(x=>{
      const stock=+x.stock||0;
      const min=x.min!==undefined&&x.min!==null&&x.min!==''?+x.min:5;
      if(stock>min) return null;
      const suggestedQty=Math.max(1,Math.round(min*2-stock));
      return {sku:x.sku,name:x.name,stock,min,suggestedQty};
    })
    .filter(Boolean)
    .sort((a,b)=>(a.stock-a.min)-(b.stock-b.min));
}
function autoProductionPage(m){
  const rows=autoProductionSuggestions();
  const stations=(db.stations||[]).filter(s=>s.status==='Active').sort((a,b)=>a.name.localeCompare(b.name));

  (stations.length?'':'<div class="box"><p class="hint">⚠️ ยังไม่มี Station ที่เปิดใช้งานอยู่ ต้องไปเพิ่มที่หน้า "จัดการ Station / Tablet" ก่อน ถึงจะเลือกส่งงานได้</p></div>')+
  `<div class="box">${rows.length?`<table><tr><th><input type="checkbox" onclick="document.querySelectorAll('.apChk').forEach(c=>c.checked=this.checked)"></th><th>สินค้า</th><th>Stock</th><th>Min</th><th>จำนวนที่จะสั่งผลิต</th><th>ส่งไป Station</th></tr>${rows.map(r=>`<tr><td><input type="checkbox" class="apChk" data-sku="${escHTML(r.sku)}" checked></td><td><b>${escHTML(r.sku)}</b><br><span class="mini">${escHTML(r.name)}</span></td><td><b class="danger">${roundDisplay(r.stock)}</b></td><td>${roundDisplay(r.min)}</td><td><input type="number" min="1" class="apQty" id="apQty_${escHTML(r.sku)}" value="${r.suggestedQty}" style="width:110px"></td><td><select class="apStation" id="apStation_${escHTML(r.sku)}"><option value="">-- เลือก Station --</option>${stations.map(s=>`<option value="${s.id}">${escHTML(s.name)}</option>`).join('')}</select></td></tr>`).join('')}</table><div style="margin-top:16px"><button class="primary" onclick="confirmAutoProductionAction()">✅ ยืนยันสั่งผลิตรายการที่ติ๊กไว้</button></div>`:'<p class="hint">✅ ตอนนี้สินค้าทุกตัวยังมี Stock สูงกว่า Min Stock อยู่ ไม่มีอะไรต้องสั่งผลิตเพิ่ม</p>'}</div>`;
}

function rmLotExpiryInfo(l){
  if(!l.expiryDate) return null;
  const days=Math.floor((new Date(l.expiryDate)-new Date(todayISO()))/86400000);
  if(days<0) return {cls:'bad',text:'หมดอายุแล้ว '+Math.abs(days)+' วัน'};
  if(days<=30) return {cls:'bad',text:'ใกล้หมดอายุ อีก '+days+' วัน'};
  if(days<=90) return {cls:'',text:'อีก '+days+' วัน'};
  return null;
}

function updateBoothShipRowValue(sku,price){
  const qty=+$('bshqty_'+sku)?.value||0;

  document.querySelectorAll('.bshChk:checked').forEach(c=>{
    const q2=+$('bshqty_'+c.dataset.sku)?.value||0;

function poListHTML(){
  const pos=(db.purchaseOrder||[]).slice().sort((a,b)=>trxSortKey(b.orderDate)-trxSortKey(a.orderDate));

    </div>`;
  }).join('');

function _pcDupWarnings(lines){
  const out=[];
  (lines||[]).forEach(ln=>{
    if(!ln.rmCode) return;
    (db.purchaseOrderItems||[]).forEach(it=>{
      if(String(it.rmCode)!==String(ln.rmCode)) return;
      const po=(db.purchaseOrder||[]).find(p=>p.po===it.po); if(!po||!po.orderDate) return;
      const age=Date.now()-trxSortKey(po.orderDate);
      if(age>=0 && age<=6*864e5){
        out.push(`• ${ln.rmCode} (${itemName(ln.rmCode)}) เคยสั่งเมื่อ ${po.orderDate} จำนวน ${roundDisplay(it.orderQty)} — ${po.po}`);
      }
    });
  });
  return out;
}
async function submitPurchaseOrder(){
  _pcReadPoLines();
  poSupplierId=$('poSupplierId')?.value||'';
  const supObj=(db.suppliers||[]).find(s=>s.id===poSupplierId);
  const supplier=supObj?supObj.name:'';
  const orderDate=$('poOrderDate')?.value||todayISO();
  const remark=($('poRemark')?.value||'').trim();
  const items=poDraftLines.map(l=>({rmCode:l.rmCode,qty:+l.qty||0,price:+l.price||0})).filter(l=>l.rmCode&&l.qty>0);
  if(!poSupplierId||!supplier) return toast('เลือกซัพพลายเออร์ก่อน');

  if(dup.length){
    const ok=await confirmModal('พบการสั่งซ้ำภายใน 6 วัน:\n\n'+dup.join('\n')+'\n\nยืนยันบันทึกใบสั่งซื้อนี้ต่อ?','ยืนยันบันทึก','ยกเลิก');

  }
  toast('กำลังบันทึกใบสั่งซื้อ...');
  try{
    const res=await apiPost({action:'createpurchaseorder',data:{supplier,orderDate,remark,items}});
    poDraftLines=[{rmCode:'',qty:'',price:''}];
    await loadFromGoogleSheet();
    page='purchasing'; purchasingTab='po'; render();
    sheetDone(res?.message||'บันทึกใบสั่งซื้อเรียบร้อยแล้ว');
  }catch(e){console.error(e); alertModal('บันทึกใบสั่งซื้อไม่สำเร็จ: '+(e.message||e));}
}

async function approveB2BOrderAction(orderId){
  const items=(db.b2bOrderItems||[]).filter(i=>i.orderId===orderId);
  const adjustedItems=[];
  for(const [idx,i] of items.entries()){
    const qty=+($('b2bQty_'+orderId+'_'+idx)?.value||0)||0;
    if(qty<=0) continue;
    const stationId=$('b2bStation_'+orderId+'_'+idx)?.value||'';
    if(!stationId) return toast('เลือก Station ให้ '+i.sku+' ก่อน (หรือใส่จำนวน 0 ถ้าไม่ต้องผลิตเพิ่ม)');
    adjustedItems.push({sku:i.sku,qty,stationId,remark:i.remark||''});

  const confirmMsg=adjustedItems.length?('อนุมัติออเดอร์นี้และสร้างคำสั่งผลิต '+adjustedItems.length+' รายการทันที?'):'Stock ที่มีอยู่พอกับออเดอร์นี้แล้วทุกรายการ ยืนยันอนุมัติโดยไม่ต้องสร้างคำสั่งผลิตเพิ่ม?';
  if(!await confirmModal(confirmMsg))return;
  toast('กำลังอนุมัติ...');
  try{
    const res=await apiPost({action:'approveb2border',orderId,data:{items:adjustedItems}});
    await loadFromGoogleSheet();
    page='b2borders'; render();
    sheetDone(res?.message||'อนุมัติแล้ว สร้างคำสั่งผลิตเรียบร้อย');

async function voidRMMovement(moveId,reason){
  if(!moveId)return;
  toast('กำลัง Void รายการวัตถุดิบ...');
  const mv=(db.mov||[]).find(x=>String(x.id||x.ref||'')===String(moveId));
  try{
    const res=await apiPost({action:'voidrmmovementfast',moveId,reason});
    if(mv){
      // v9.44: คำนวณย้อนกลับ Stock ในเครื่องทันที เหมือนกับ Void FG ไม่ต้องรอโหลดข้อมูลทั้งหมดใหม่
      const rmItem=(db.rm||[]).find(x=>String(x.sku)===String(mv.sku));
      if(rmItem){
        const mode=String(mv.mode||'').toUpperCase();
        const qty=+mv.qty||0;
        const isAdd=['IN','ADJ_IN','RETURN','RECEIVE'].includes(mode);
        rmItem.stock=(+rmItem.stock||0)+(isAdd?-qty:qty);
      }
      db.mov=db.mov||[];
      db.mov.push({id:res?.reverseMoveId||('MV-'+Date.now()),time:now(),type:'RM',sku:mv.sku,mode:(['IN','ADJ_IN','RETURN','RECEIVE'].includes(String(mv.mode||'').toUpperCase())?'ADJ_OUT':'ADJ_IN'),qty:+mv.qty||0,ref:'VOID-'+moveId,remark:'Void RM movement: '+reason,stock:rmItem?.stock||0,source:'ERP-VOID-RM',synced:true});
    }
    saveLocalOnly(); trxHistTab='trx'; page='trxhistory'; render();
    sheetDone('Void รายการวัตถุดิบสำเร็จ / Stock อัปเดตแล้ว');

function poDuration(p){
  // v9.63: เวลาที่ใช้ผลิตจริง (จบ-เริ่ม) เฉพาะงานที่มี StartAt/FinishAt บันทึกไว้
  if(!p.start||!p.finish) return null;
  const ms=new Date(p.finish)-new Date(p.start);
  if(!(ms>0)) return null;
  const mins=Math.round(ms/60000);
  const h=Math.floor(mins/60), m=mins%60;
  const label=(h>0?h+' ชม. ':'')+m+' นาที';
  const qty=+(p.actualQty||p.qty)||0;
  const perPiece=qty>0?(ms/60000/qty):null;
  return {label, perPieceLabel: perPiece!=null?(perPiece<1?Math.round(perPiece*60)+' วิ/ชิ้น':perPiece.toFixed(1)+' นาที/ชิ้น'):null};
}

function yieldInfo(p){
  // v9.88: Yield = pcs ที่ได้จริง ÷ (Batch ที่ผสมจริง × Batch Yield ที่ตั้งไว้) — ต้องมีทั้ง actualQty และ actualBatches
  const batchYield=getBatchYield(p.sku);
  if(batchYield<=1) return null;
  const hasActualQty=p.actualQty!==undefined&&p.actualQty!=='' && p.actualQty!==null;
  const hasActualBatches=p.actualBatches!==undefined&&p.actualBatches!=='' && p.actualBatches!==null;
  if(!hasActualQty||!hasActualBatches||!(+p.actualBatches>0)) return null;
  const expected=+p.actualBatches*batchYield;
  const pct=(+p.actualQty/expected*100);
  return {pct,expected,actual:+p.actualQty,cls:pct>=98?'good':(pct>=90?'':'danger')};
}

  const notDone=!['Completed','Cancelled'].includes(p.status);

  const chkCell=notDone?`<input type="checkbox" class="poAssignChk" value="${p.id}" style="width:20px;height:20px">`:'';
  return `<tr><td>${chkCell}</td><td>${p.time}</td><td>${p.id}</td><td><b>${p.sku}</b><br><span class="mini">${escHTML(itemName(p.sku))}</span></td><td>${qtyDisplay}</td><td>${yieldCell}</td><td>${assignCell}</td><td>${poStatusPillNew(p)}</td><td>${durCell}</td><td>${reqText(p.sku,p.qty)}</td><td class="actions">${poActions(p)}</td></tr>`;
}).join('')}</table>`}

    console.error(e); alertModal('ยกเลิกไม่สำเร็จ: '+(e.message||e)+'\n\nสถานะถูกย้อนกลับแล้ว ลองใหม่อีกครั้ง');
  }
}
async function setPO(id,s){
  let p=db.po.find(x=>x.id==id); if(!p) return;
  const prevStatus=p.status, prevFinish=p.finish;
  p.status=s; if(s=='Finished')p.finish=now();
  saveLocalOnly(); render();
  // v9.42 fix: เดิมยิง savePODirect(p) แบบไม่รอผล (fire-and-forget) แล้วขึ้น toast "สำเร็จ" ทันที
  // ถ้าการบันทึกจริงล้มเหลว (เน็ตหลุด/timeout) ผู้ใช้จะเห็นว่า "Cancelled" แล้วในเครื่อง แต่ Google Sheet
  // ยังเป็นสถานะเดิมอยู่ ทำให้ระบบอื่นที่เช็คสถานะจริงจากชีต (เช่น กันสร้าง PO ซ้ำจาก ShippingPlan)
  // ยังเห็น PO นี้เป็น Active อยู่ ตอนนี้รอผลจริงก่อน ถ้าล้มเหลวจะย้อนสถานะกลับให้อัตโนมัติ
  try{
    await apiPost({action:'upsert',sheet:'ProductionOrder',key:'PO',data:poPayload(p)});
    sheetDone('เปลี่ยนสถานะเป็น '+s+' แล้ว / ส่งเข้า Google Sheet สำเร็จจริง');
  }catch(e){
    p.status=prevStatus; p.finish=prevFinish;
    saveLocalOnly(); render();
    alertModal('เปลี่ยนสถานะไม่สำเร็จ: '+(e.message||e)+'\n\nสถานะใน ERP ถูกย้อนกลับเป็น "'+prevStatus+'" แล้ว (ของจริงใน Google Sheet ไม่เคยเปลี่ยน) ลองกดใหม่อีกครั้ง');
  }
}
function completePO(id){
  let p=db.po.find(x=>x.id==id); if(!p) return;
  modal(`<h2>ยืนยันจำนวนที่ผลิตได้จริง</h2><p class="hint">${p.sku} · สั่งผลิต ${p.qty} ชิ้น — ใส่จำนวนที่ทำได้จริง (ถ้าเท่ากับที่สั่งไว้ไม่ต้องแก้)<br>ระบบจะตัดวัตถุดิบ (BOM) ตามจำนวนที่ใส่นี้เลย</p><input id="actualQtyInput" type="number" min="0" value="${p.qty}" style="font-size:20px;text-align:center"><br><br><button class="primary" onclick="confirmCompletePO('${id}')">ยืนยัน / ตัด RM / รับเข้า Stock</button> <button class="ghost" onclick="$('modal').style.display='none'">ยกเลิก</button>`);
}
async function confirmCompletePO(id){
  let p=db.po.find(x=>x.id==id); if(!p) return;
  let actual=+$('actualQtyInput')?.value;
  if(isNaN(actual)||actual<0) return toast('ใส่จำนวนที่ผลิตได้จริงก่อน');
  const bomLines=(db.bom[p.sku]||[]).filter(l=>(l.stage||'Production')==='Production');
  // v9.43: เดิมตัด RM ตอนกด "Start" โดยใช้จำนวนที่สั่งไว้ (p.qty) แยกขั้นตอนจากตอนใส่จำนวนจริง
  // ตอนนี้รวมเป็นขั้นตอนเดียว (Open → Complete) ตัด RM ตามจำนวนที่ผลิตได้จริงที่เพิ่งกรอก ไม่ใช่จำนวนที่สั่ง
  if(!bomLines.length && !await confirmModal('SKU '+p.sku+' ยังไม่ได้ตั้ง BOM จะบันทึกโดยไม่ตัดวัตถุดิบเลยหรือไม่?')) return;
  $('modal').style.display='none';
  const before=(db.mov||[]).length;
  const batchYield=getBatchYield(p.sku);
  bomLines.forEach(r=>move('RM',r.sku,'OUT',(+r.qty||0)*actual/batchYield,p.id,'Issue to production (ตัดตามจำนวนผลิตจริง)'));
  // v9.90 fix: เดิมเข้า FG ตรงๆ เสมอ แม้ SKU จะตั้ง Batch Yield ไว้ (ต้องรอแพ็คก่อน) ทำให้ WIP ไม่ขยับ
  // ตอนนี้ SKU ที่ตั้ง Batch Yield ไว้ (>1) จะเข้า WIP ก่อนเหมือนฝั่งอื่นๆ ที่แก้ไปแล้ว
  const itemTypeComplete=batchYield>1?'WIP':'FG';
  move(itemTypeComplete,p.sku,'IN',actual,p.id,(itemTypeComplete==='WIP'?'Production completed (รอแพ็ค)':'Production completed')+(actual!==+p.qty?` (สั่ง ${p.qty} / ผลิตจริง ${actual})`:''));
  p.status='Completed'; p.finish=now(); p.actualQty=actual;
  saveLocalOnly(); render(); sendNewMovementsSince(before); savePODirect(p);
  toast(actual===+p.qty?'Completed / ตัด RM แล้ว / รับ'+(itemTypeComplete==='WIP'?' WIP':' FG')+' เข้า Stock แล้ว / ส่งเข้า Google Sheet':`Completed ตัด RM ตามจำนวนจริง ${actual} ชิ้น (สั่ง ${p.qty}) / ส่งเข้า Google Sheet`);
}

function getOrderDay(date){db.orderDays=db.orderDays||[]; let os=db.orderDays.find(x=>x.date==date); if(!os){os={date,total:0,shipped:0,note:'',shortages:[]};} return os;}
function upsertOrderDay(os){db.orderDays=db.orderDays||[]; let i=db.orderDays.findIndex(x=>x.date==os.date); if(i>=0) db.orderDays[i]=os; else db.orderDays.push(os);}
function saveOrderDay(){let date=$('orderDate').value||todayISO(); let os=getOrderDay(date); os.date=date; os.total=+$('oday_total').value||0; os.shipped=Math.min(+$('oday_shipped').value||0, os.total); os.note=$('oday_note').value||''; os.shortages=os.shortages||[]; upsertOrderDay(os); saveLocalOnly(); render(); saveOrderDirect(os); toast('บันทึกสรุป Order แล้ว / ส่งเข้า Google Sheet ทันที')}
function addShortageLine(){let date=$('orderDate').value||todayISO(); let os=getOrderDay(date); os.total=+$('oday_total').value||0; os.shipped=Math.min(+$('oday_shipped').value||0, os.total); os.note=$('oday_note').value||''; let sku=$('shortSku').value, qty=+$('shortQty').value||0, reason=$('shortReason').value||''; if(!sku||qty<=0)return toast('เลือก SKU และใส่จำนวนที่ขาด'); let line={sku,qty,reason}; os.shortages=os.shortages||[]; os.shortages.push(line); upsertOrderDay(os); saveLocalOnly(); render(); saveOrderDirect(os); saveOrderItemDirect(date,line); toast('เพิ่มรายการขาดแล้ว / ส่งเข้า Google Sheet ทันที')}
function removeShortageLine(date,i){let os=getOrderDay(date); let removed=(os.shortages||[])[i]; (os.shortages||[]).splice(i,1); upsertOrderDay(os); saveLocalOnly(); render(); saveOrderDirect(os); if(removed) deleteSheet('OrderItems','OrderNo','DAY-'+date+'-'+removed.sku,'OrderItems'); toast('ลบรายการแล้ว / อัปเดต Google Sheet')}
function updateShortageReason(date,i,val){let os=getOrderDay(date); if(os.shortages&&os.shortages[i]){os.shortages[i].reason=val; upsertOrderDay(os); saveLocalOnly(); saveOrderItemDirect(date,os.shortages[i]);}}
function orderDayCard(os){return `<table><tr><th>วันที่</th><th>Order</th><th>ส่งสำเร็จ</th><th>ยังไม่สำเร็จ</th><th>หมายเหตุ</th></tr><tr><td>${os.date}</td><td><b>${+os.total||0}</b></td><td><b>${+os.shipped||0}</b></td><td><b class="${((+os.total||0)-(+os.shipped||0))>0?'danger':''}">${Math.max(0,(+os.total||0)-(+os.shipped||0))}</b></td><td>${os.note||''}</td></tr></table>`}

function reqText(sku,qty,batchesOverride){
  let b=(db.bom[sku]||[]).filter(x=>(x.stage||'Production')==='Production');

   2) QR / Google Form ที่พนักงานสแกน (db.prodLog จาก Google Sheet/CSV)

function prodSummarySourceLabel(r){
  const s=String(r.source||r.Source||'').toLowerCase();
  if(s.includes('erp-manual') || s.includes('production record')) return 'บันทึกผลผลิต ERP';
  if(s.includes('google') || s.includes('csv') || s.includes('uploaded') || s.includes('paste') || s.includes('form')) return 'QR / Google Form';
  return 'QR / Google Form';
}
function prodSummaryItemInfo(sku, fallbackProduct='', fallbackVariant=''){
  const it=(db.items||[]).find(x=>String(x.sku)==String(sku))||{};
  return {
    name: it.name||'',
    product: it.product||fallbackProduct||'-',
    variant: it.variant||fallbackVariant||it.weight||'-'
  };
}

  document.querySelectorAll('button').forEach(btn=>{
    const txt=(btn.textContent||'').trim();
    const oc=btn.getAttribute('onclick')||'';
    const allowRead = /Refresh|โหลดข้อมูลจาก Google Sheet|ดูตัวอย่าง|เปิด Auto Sync|ปิด Auto Sync|Export|Download|ทดสอบ API|ไปหน้า|Search/i.test(txt+oc);
    const isWrite = writeWords.some(w=>txt.includes(w) || oc.includes(w)) || /save|add|edit|delete|remove|stockMove|create|complete|setPO|startPO|clear|restore|pushToGoogleSheet|syncProdToSheet|commitImport|applyBulk|bulkDelete/i.test(oc);
    if(isWrite && !allowRead){
      btn.classList.add('viewer-disabled');
      btn.onclick=(e)=>{e.preventDefault(); viewerDeny(); return false;};
      btn.type='button';
    }
  });
  document.querySelectorAll('input,select,textarea').forEach(el=>{
    const id=el.id||'';
    const readAllowed=/q|prodCsvUrl|Date|dashDate|fgDate|sq|fprod|frgrp|rq|mdq|mdTarget|stype|sprod|ctype|cprod|pprod|bprod|bsku/i.test(id);

      el.readOnly=true;
      el.disabled=true;
    }
  });
}

function productionSummaryMoveSource(m){
  const src=String(m.source||m.Source||'').toLowerCase();
  const ref=String(m.ref||m.Ref||'');
  const rem=String(m.remark||m.Remark||'').toLowerCase();
  if(src.includes('produce') || src.includes('erp-manual') || rem.includes('production record')) return 'บันทึกผลผลิต ERP';
  if(src.includes('google') || src.includes('form') || src.includes('csv') || ref.includes('GS-') || ref.includes('FGP-')) return 'QR / Google Form';
  return 'บันทึกผลผลิต ERP';
}
function productionSummaryAllRows(){
  const out=[];
  const poRefs=new Set();
  const logRefs=new Set();
  (db.po||[]).forEach(p=>{
    if(String(p.status||'').toLowerCase()!=='completed') return;
    const sku=String(p.sku||p.SKU||'');
    const info=prodSummaryItemInfo(sku);
    const ref=p.id||p.PO||'';
    if(ref) poRefs.add(String(ref));
    out.push({date:dateISO(p.finish||p.FinishAt||p.time||p.CreatedAt||''),timestamp:p.finish||p.FinishAt||p.time||p.CreatedAt||'',source:'คำสั่งผลิต ERP',ref,sku,name:info.name,product:info.product,variant:info.variant,qty:+p.qty||+p.Qty||0});
  });
  (db.prodLog||[]).forEach(r=>{
    const status=String(r.status||r.Status||'Active').toLowerCase();
    if(status==='voided' || status==='cancelled') return;
    const sku=String(r.sku||r.SKU||'');
    const info=prodSummaryItemInfo(sku, r.product||r.Product||'', r.variant||r.Variant||'');
    const ref=r.id||r.LogID||'';
    if(ref) logRefs.add(String(ref));
    out.push({date:dateISO(r.timestamp||r.Timestamp||r.mfgDate||r.MfgDate||''),timestamp:r.timestamp||r.Timestamp||r.mfgDate||r.MfgDate||'',source:prodSummarySourceLabel(r),ref,sku,name:info.name,product:info.product,variant:info.variant,qty:+r.qty||+r.Qty||0});
  });
  // สำรองสำคัญ: หลัง Refresh บางแหล่งอาจเหลือใน StockMovement แต่ไม่อยู่ใน ProductionLog
  // ให้ดึง FG IN จาก StockMovement เฉพาะที่ไม่ซ้ำกับ PO / ProductionLog
  (db.mov||[]).forEach(m=>{
    const type=String(m.type||m.ItemType||'').toUpperCase();
    const mode=String(m.mode||m.Mode||'').toUpperCase();
    const ref=String(m.ref||m.Ref||'');
    const qty=+m.qty||+m.Qty||0;
    const src=String(m.source||m.Source||'').toLowerCase();
    if(type!=='FG') return;
    if(qty<=0) return;
    if(['OUT','ADJ_OUT','SCRAP','ISSUE','CYCLE_COUNT'].includes(mode)) return;
    if(ref && (poRefs.has(ref) || logRefs.has(ref))) return;
    if(ref.startsWith('VOID-') || src.includes('void')) return;
    const sku=String(m.sku||m.SKU||'');
    const info=prodSummaryItemInfo(sku);
    out.push({date:dateISO(m.time||m.Timestamp||''),timestamp:m.time||m.Timestamp||'',source:productionSummaryMoveSource(m),ref,sku,name:info.name,product:info.product,variant:info.variant,qty});
  });
  return out.filter(x=>x.sku && x.qty>0);
}

function yieldSummaryTable(){
  // v9.88: รวบรวม Yield จากทั้ง PO (ProductionOrder) และบันทึกผลผลิตตรง (ProductionLog) ที่มี ActualBatches
  const bySku={};
  (db.po||[]).forEach(p=>{
    const batchYield=getBatchYield(p.sku);
    if(batchYield<=1) return;
    const hasQty=p.actualQty!==undefined&&p.actualQty!=='' && p.actualQty!==null;
    const hasBatches=p.actualBatches!==undefined&&p.actualBatches!=='' && p.actualBatches!==null && +p.actualBatches>0;
    if(!hasQty||!hasBatches) return;
    (bySku[p.sku]=bySku[p.sku]||[]).push({actual:+p.actualQty,batches:+p.actualBatches,batchYield});
  });
  (db.prodLog||[]).forEach(l=>{
    const batchYield=getBatchYield(l.sku);
    if(batchYield<=1) return;
    const hasBatches=l.actualBatches!==undefined&&l.actualBatches!=='' && l.actualBatches!==null && +l.actualBatches>0;
    if(!hasBatches||!(+l.qty>0)) return;
    (bySku[l.sku]=bySku[l.sku]||[]).push({actual:+l.qty,batches:+l.actualBatches,batchYield});
  });
  const skus=Object.keys(bySku);
  if(!skus.length) return '<p class="hint">ยังไม่มีข้อมูลพอคำนวณ (ต้องใส่ "Batch ที่ผสมจริง" ตอนบันทึกผลผลิตก่อน)</p>';
  const rows=skus.map(sku=>{
    const entries=bySku[sku];
    const totalActual=entries.reduce((a,e)=>a+e.actual,0);
    const totalExpected=entries.reduce((a,e)=>a+e.batches*e.batchYield,0);
    const avgYieldPerBatch=entries.reduce((a,e)=>a+e.actual/e.batches,0)/entries.length;
    const pct=totalExpected>0?(totalActual/totalExpected*100):0;
    const currentBatchYield=entries[0].batchYield;
    const suggested=Math.round(avgYieldPerBatch*10)/10;
    return {sku,count:entries.length,pct,currentBatchYield,suggested};
  }).sort((a,b)=>a.pct-b.pct);
  return `<table><tr><th>SKU</th><th>ชื่อสินค้า</th><th>จำนวนครั้งที่บันทึก</th><th>Yield เฉลี่ย</th><th>Batch Yield ปัจจุบัน</th><th>Batch Yield ที่แนะนำ</th><th></th></tr>${rows.map(r=>`<tr><td><b>${r.sku}</b></td><td>${escHTML(itemName(r.sku))}</td><td>${r.count}</td><td><b class="${r.pct>=98?'good':(r.pct>=90?'':'danger')}">${r.pct.toFixed(1)}%</b></td><td>${r.currentBatchYield}</td><td><b>${r.suggested}</b></td><td>${Math.abs(r.suggested-r.currentBatchYield)>=0.5?`<button class="small" onclick="applySuggestedBatchYield('${r.sku}',${r.suggested})">ปรับเป็นค่าแนะนำ</button>`:'<span class="mini">ใกล้เคียงอยู่แล้ว</span>'}</td></tr>`).join('')}</table>`;
}
async function applySuggestedBatchYield(sku,suggested){
  if(!await confirmModal('ปรับ Batch Yield ของ '+sku+' เป็น '+suggested+' (จากค่าเฉลี่ยย้อนหลัง)?'))return;
  const x=db.items.find(i=>i.sku==sku); if(!x) return;
  x.batchYield=suggested; saveLocalOnly(); render();
  toast('กำลังบันทึก...');
  try{ await saveProductDirect(x); sheetDone('ปรับ Batch Yield ของ '+sku+' เป็น '+suggested+' แล้ว'); }
  catch(e){ console.error(e); alertModal('บันทึกไม่สำเร็จ: '+(e.message||e)); }
}

function erpKeyVal(o, keys){ for(const k of keys){ if(o && o[k]!==undefined && o[k]!==null && String(o[k])!=='') return String(o[k]); } return ''; }
function erpMergeByKey(localArr, remoteArr, keys){
  const map=new Map();
  (localArr||[]).forEach(o=>{const k=erpKeyVal(o,keys); if(k) map.set(k,o);});
  (remoteArr||[]).forEach(o=>{const k=erpKeyVal(o,keys); if(k) map.set(k,{...(map.get(k)||{}),...o});});
  return Array.from(map.values());
}
function erpMergeByFn(localArr, remoteArr, keyFn){
  const map=new Map();
  (localArr||[]).forEach(o=>{const k=keyFn(o); if(k) map.set(k,o);});
  (remoteArr||[]).forEach(o=>{const k=keyFn(o); if(k) map.set(k,{...(map.get(k)||{}),...o});});
  return Array.from(map.values());
}

  db.b2bOrderItems=(data.b2bOrderItems||[]).map(i=>({orderId:i.OrderID||'',sku:String(i.SKU||''),qty:+i.Qty||0,remark:i.Remark||''})).filter(x=>x.orderId);

function saveCycleCount(){
  let type=$('ctype')?.value||'FG', reason=$('creason')?.value||'Cycle Count', remark=$('cremark')?.value||'';
  let rows=[...document.querySelectorAll('.cycleChk:checked')].map(c=>{let sku=c.dataset.sku, v=$('ccount_'+sku)?.value; return {sku,counted:v===''?null:+v};}).filter(x=>x.counted!==null && x.counted>=0);
  if(!rows.length)return toast('ติ๊ก SKU และใส่ยอดนับจริงก่อน');
  let ref='CC-'+Date.now(); const pairs=[];
  rows.forEach(r=>{
    let arr=type=='RM'?db.rm:db.items, it=arr.find(x=>x.sku==r.sku); if(!it)return;
    let before=+it.stock||0, diff=r.counted-before; it.stock=r.counted;
    let rec={id:'MV-'+Date.now()+'-'+Math.floor(Math.random()*9999),time:now(),type,sku:r.sku,mode:'CYCLE_COUNT',qty:diff,ref,remark:`${reason}${remark?' - '+remark:''} | Before ${before} → After ${r.counted}`,stock:it.stock,synced:false,source:'ERP-CYCLE-v9.13'};
    db.mov.push(rec);
    pairs.push({
      mov:{MoveID:rec.id,Timestamp:rec.time,ItemType:type,SKU:r.sku,Mode:'CYCLE_COUNT',Qty:diff,Ref:ref,Remark:rec.remark,StockAfter:r.counted,Source:'ERP-CYCLE-v9.13'},
      cycle:{CountID:rec.id,Timestamp:rec.time,ItemType:type,SKU:r.sku,SystemQty:before,CountQty:r.counted,Diff:diff,Remark:rec.remark},
      moveId:rec.id
    });
  });
  saveLocalOnly(); render(); toast('กำลังบันทึก Cycle Count แบบเร็ว...');
  // v9.48 fix: เดิมแบ่งเป็นชุดคงที่ 15 SKU ยังไม่พอถ้า Remark เป็นภาษาไทยยาวๆ (encode URL แล้วยาวขึ้น
  // 2-3 เท่า) ตอนนี้วัดขนาดจริงหลัง encode ก่อนแบ่งชุด ปลอดภัยไม่ว่าข้อความจะสั้นหรือยาวแค่ไหน
  (async()=>{
    let savedCount=0;
    try{
      const chunks=chunkItemsBySize_(pairs, chunk=>({action:'cycletransaction',data:{movements:chunk.map(p=>p.mov),cycles:chunk.map(p=>p.cycle)}}));
      for(const chunk of chunks){
        await apiPost({action:'cycletransaction',data:{movements:chunk.map(p=>p.mov),cycles:chunk.map(p=>p.cycle)}});
        chunk.forEach(p=>{let x=db.mov.find(v=>v.id===p.moveId); if(x)x.synced=true;});
        savedCount+=chunk.length;
        saveLocalOnly();
      }
      sheetDone('Cycle Count เข้า Google Sheet แล้ว ('+pairs.length+' SKU)');
    }catch(e){
      console.error(e);
      const statusMsg=savedCount===0
        ? 'ยังไม่มีรายการไหนบันทึกสำเร็จเลยสักตัว (0/'+pairs.length+')'
        : 'บันทึกสำเร็จไปแล้ว '+savedCount+' จาก '+pairs.length+' รายการ ส่วนที่เหลือยังไม่สำเร็จ';
      alertModal('Cycle Count: '+statusMsg+'\n\nสาเหตุ: '+(e.message||e)+'\n\nลองกด "บันทึก Cycle Count" ซ้ำได้เลย ระบบจะคำนวณผลต่างใหม่จากสต๊อกล่าสุด ตัวที่บันทึกสำเร็จไปแล้วจะไม่ถูกปรับซ้ำอีก (ผลต่างกลายเป็น 0 แล้ว) ไม่ต้องกังวลเรื่องข้อมูลซ้ำ');
    }
  })();
}
async function voidProductionTransaction(logId,reason){
  if(!logId)return;
  toast('กำลัง Void แบบเร็ว...');
  const r=(db.prodLog||[]).find(x=>String(x.id||x.LogID||'')===String(logId));
  try{
    await apiPost({action:'voidproductionfast',logId,reason,voidBy:'ERP User'});
    if(r){
      r.status='Voided'; r.Status='Voided'; r.voidReason=reason; r.VoidReason=reason; r.voidAt=now(); r.VoidAt=now();
      // v9.39 fix: เดิมโหลดข้อมูลทั้งหมดใหม่ทุกครั้งหลัง Void (ช้ามาก) ตอนนี้คำนวณ reverse Stock ในเครื่อง
      // ทันที (ลด FG คืน RM ตาม BOM) เหมือนที่ Server ทำเป๊ะๆ ไม่ต้องรอโหลดใหม่ทั้งหมด ข้อมูลจริงจะ
      // sync ครบอีกทีตอนกด Refresh ปกติหรือเปลี่ยนหน้าไปมา
      const sku=String(r.sku||r.SKU||''), qty=+(r.qty||r.Qty||0);
      if(sku && qty){
        const it=(db.items||[]).find(x=>String(x.sku)===sku);
        if(it) it.stock=(+it.stock||0)-qty;
        (db.bom?.[sku]||[]).forEach(b=>{
          const rmItem=(db.rm||[]).find(x=>String(x.sku)===String(b.sku));
          if(rmItem) rmItem.stock=(+rmItem.stock||0)+qty*(+b.qty||0);
        });
      }
    }
    saveLocalOnly(); trxHistTab='trx'; page='trxhistory'; render();
    sheetDone('Void สำเร็จ / Stock อัปเดตแล้ว');
  }catch(e){
    // เชื่อมต่อมีปัญหาจริง ไม่รู้ผลชัวร์ ต้องโหลดใหม่ทั้งหมดเพื่อเช็คสถานะจริง (กรณีนี้เท่านั้นถึงจะช้า)
    try{ await loadFromGoogleSheet(); trxHistTab='trx'; page='trxhistory'; render(); }catch(e2){ console.error('refresh after void failed', e2); }
    alertModal('การเชื่อมต่อตอน Void มีปัญหา (Server มักทำงานเสร็จจริงแล้ว): '+(e.message||e)+'\n\nระบบโหลดข้อมูลล่าสุดให้แล้ว เช็คในตารางว่า Void สำเร็จหรือยัง');
  }
}

function showLoginScreen(msg){

async function doLogin(){
  const uEl=$('loginUser'), pwEl=$('loginPw');
  const u=(uEl&&uEl.value||'').trim();
  const pw=(pwEl&&pwEl.value||'').trim();
  const errEl=$('loginError');
  if(!u||!pw){ if(errEl) errEl.textContent='กรุณากรอก Username และรหัสผ่าน'; return; }
  const btn=document.querySelector('#loginScreen button.primary');
  if(btn){btn.disabled=true;btn.textContent='กำลังตรวจสอบ...';}
  if(errEl) errEl.textContent='';
  try{
    const res=await apiPost({action:'login',username:u,password:pw});
    sessionToken=res.token; userRole=res.role; userDisplayName=res.displayName; userUsername=res.username;
    localStorage.setItem('bakery_session_token',sessionToken);
    localStorage.setItem('bakery_user_role',userRole);
    localStorage.setItem('bakery_user_display_name',userDisplayName);
    localStorage.setItem('bakery_user_username',userUsername);
    localStorage.setItem('bakery_logged_in','1');
    sessionExpiredHandled_=false;
    hideLoginScreen();
    startApp();
  }catch(e){
    if(errEl) errEl.textContent='เข้าสู่ระบบไม่สำเร็จ: '+(e.message||e);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='เข้าสู่ระบบ';}
  }
}

}
